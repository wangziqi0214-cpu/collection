<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>📮 大王的收藏夹</title>
<style>
:root{--bg:#0f1115;--card:#1a1e26;--card2:#222836;--accent:#e8a33d;--accent2:#4da3ff;--text:#e8e6e3;--sub:#8b919e;--danger:#ff5f57;--ok:#34c759;--radius:14px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;padding-bottom:70px}
header{position:sticky;top:0;background:rgba(15,17,21,.94);backdrop-filter:blur(14px);padding:18px 16px 12px;border-bottom:1px solid #262b36;z-index:20}
header h1{font-size:21px;font-weight:700;display:flex;align-items:center;gap:8px}
header h1 .em{color:var(--accent)}
.meta{display:flex;gap:12px;font-size:12px;color:var(--sub);margin-top:6px;flex-wrap:wrap}
.meta b{color:var(--text)}
.toolbar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.search{flex:1;min-width:150px;background:var(--card);border:1px solid #2a3140;border-radius:10px;padding:9px 12px;color:var(--text);font-size:14px;outline:none}
.search:focus{border-color:var(--accent)}
.chip{background:var(--card);border:1px solid #2a3140;border-radius:20px;padding:7px 14px;font-size:12.5px;color:var(--sub);cursor:pointer;white-space:nowrap;user-select:none}
.chip.on{background:var(--accent);color:#141414;border-color:var(--accent);font-weight:600}
.catbar{display:flex;gap:6px;overflow-x:auto;padding:8px 16px 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.catbar::-webkit-scrollbar{display:none}
.catchip{flex:0 0 auto;background:var(--card);border:1px solid #2a3140;color:var(--sub);font-size:12px;padding:6px 12px;border-radius:16px;cursor:pointer;white-space:nowrap;user-select:none}
.catchip i{font-style:normal;opacity:.55;font-size:11px;margin-left:3px}
.catchip.on{background:var(--accent);color:#141414;border-color:var(--accent);font-weight:700}
.badge{display:inline-block;background:#1c212b;border:1px solid #333a49;color:var(--sub);font-size:10.5px;padding:1px 8px;border-radius:10px;margin-left:6px;vertical-align:1px;font-weight:500}
.badge.b-skill{color:#ffd166;border-color:#4a3f1a}
.badge.b-tips{color:#7dd3fc;border-color:#1e3a5f}
.badge.b-tools{color:#86efac;border-color:#1e4a2f}
.badge.b-tutorial{color:#c4b5fd;border-color:#3b2f6e}
.badge.b-insight{color:#f9a8d4;border-color:#5c2343}
.badge.b-career{color:#fdba74;border-color:#5c3a1e}
.badge.b-life{color:#6ee7b7;border-color:#1f5c44}
.badge.b-wisdom{color:#93c5fd;border-color:#234a7a}
.badge.b-misc{color:#9ca3af;border-color:#374151}
.badge.b-deals{color:#fde68a;border-color:#5c4a1e}
.badge.b-create{color:#f0abfc;border-color:#5c235c}
.catcheck{display:flex;flex-wrap:wrap;gap:6px}
.catcheck label{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid #2a3140;border-radius:8px;padding:7px 11px;font-size:12.5px;cursor:pointer;user-select:none}
.catcheck input{accent-color:var(--accent);width:14px;height:14px}
.catcheck label:has(input:checked){border-color:var(--accent);color:var(--accent);font-weight:600}
.btn{background:var(--accent);color:#141414;border:none;border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid #2a3140;font-weight:500}
.btn.danger{background:rgba(255,95,87,.15);color:var(--danger);border:1px solid rgba(255,95,87,.3)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.list{padding:14px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:var(--radius);padding:14px 14px 12px;border:1px solid #232936;position:relative;transition:opacity .2s}
.card.dim{opacity:.45}
.card .date{font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.5px}
.card h2{font-size:16px;font-weight:650;margin:4px 0 5px;line-height:1.45;padding-right:44px}
.card .src{font-size:12px;color:var(--sub);margin-bottom:6px;display:flex;align-items:center;gap:5px}
.card .desc{font-size:13.5px;color:#c9ccd4;line-height:1.6;margin-bottom:9px}
.card .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .link{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--accent2);text-decoration:none;font-weight:600;padding:4px 0}
.card .link:active{opacity:.7}
.card .del{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,95,87,.3);background:rgba(255,95,87,.08);color:var(--danger);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.card .del:active{background:rgba(255,95,87,.2)}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(15,17,21,.96);padding:9px;text-align:center;font-size:11px;color:var(--sub);border-top:1px solid #262b36;z-index:20}
.empty{text-align:center;color:var(--sub);padding:60px 20px;font-size:14px;line-height:1.8}
/* modal */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal-mask.show{display:flex}
.modal{background:var(--card);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:slideup .25s ease}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal h3{font-size:17px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;background:var(--card2);border:1px solid #2a3140;border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px;outline:none;font-family:inherit}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{min-height:70px;resize:vertical;line-height:1.5}
.modal .row{display:flex;gap:10px}
.modal .row .field{flex:1}
.modal .btns{display:flex;gap:10px;margin-top:16px}
.modal .btns .btn{flex:1;padding:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2a3140;color:var(--text);padding:10px 20px;border-radius:10px;font-size:13px;z-index:100;display:none;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.toast.show{display:block;animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.tabbar{display:flex;border-bottom:1px solid #262b36;margin:0 0 4px}
.tabbar button{flex:1;background:none;border:none;color:var(--sub);font-size:13px;padding:8px 0 10px;cursor:pointer;border-bottom:2px solid transparent}
.tabbar button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.hidden{display:none!important}
@media(min-width:700px){.modal-mask{align-items:center}.modal{border-radius:20px}}
</style>
</head>
<body>
<header>
  <h1>📮 大王<span class="em">的收藏夹</span></h1>
  <div class="meta"><span>共 <b id="count">0</b> 条</span><span id="updated"></span></div>
  <div class="tabbar">
    <button id="tab-view" class="on" onclick="switchTab('view')">👀 浏览</button>
    <button id="tab-manage" onclick="switchTab('manage')">✏️ 管理</button>
  </div>
</header>

<main id="view-pane">
  <div class="toolbar">
    <input class="search" id="search" placeholder="🔍 搜索标题/来源/说明…" oninput="render()">
  </div>
  <div class="catbar" id="catbar"></div>
  <div class="toolbar" id="filters"></div>
  <div class="list" id="list"></div>
</main>

<main id="manage-pane" class="hidden">
  <div class="toolbar">
    <button class="btn" onclick="openAdd()">＋ 新增收藏</button>
    <button class="btn ghost" onclick="exportAll()">📤 导出</button>
    <button class="btn ghost" onclick="importAll()">📥 导入</button>
  </div>
  <div class="toolbar">
    <button class="btn ghost sm" onclick="backupLocal()">💾 备份到本地</button>
    <button class="btn ghost sm" onclick="restoreLocal()">↩️ 恢复备份</button>
    <button class="btn danger sm" onclick="clearLocal()">🗑️ 清空本地</button>
  </div>
  <div class="list" id="manage-list"></div>
</main>

<footer id="foot">每晚 21:00 自动同步 · 数据源:邮箱收藏 + 本地管理</footer>

<div class="modal-mask" id="modal-mask" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="modal-title">新增收藏</h3>
    <input type="hidden" id="f-idx">
    <div class="field"><label>标题 *</label><input id="f-title" placeholder="收藏标题"></div>
    <div class="field"><label>链接</label><input id="f-link" placeholder="https://…"></div>
    <div class="row">
      <div class="field"><label>日期</label><input id="f-date" type="date"></div>
      <div class="field"><label>来源</label><input id="f-src" placeholder="来源/平台"></div>
    </div>
    <div class="field"><label>分类(可多选)</label><div id="f-cat" class="catcheck"></div></div>
    <div class="field"><label>说明</label><textarea id="f-desc" placeholder="为什么值得收藏…"></textarea></div>
    <div class="btns">
      <button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn" id="save-btn" onclick="saveEntry()">保存</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

,{"date":"2026-08-06","title":"Swiftlet：Mac 上仅 4.3GB 内存跑 Qwen 80B","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/2H4g0sTodWU","desc":"小红书笔记（作者 北三陆的猫）：Hacker News 爆火的开源项目 Swiftlet，基于 Swift + Metal 的底层运行时，专为 Qwen3-Next 和 Qwen3.5/3.6 的 MoE 架构设计。核心机制是只把较小的 Dense 层常驻内存，巨大的 MoE 专家权重按路由需求从 SSD 流式加载：实测 Mac 仅用 4.3GB 内存跑 80B 模型，iPhone 17 上用 2.5GB 可用内存跑 35B 模型约 1 tok/s。该方案有争议——依赖 SSD 疯狂读取会遇 Prefill 性能瓶颈，且高频随机读取损伤硬盘寿命；另一派认为这是端侧 AI 走向普及的必经之路。","_fileDate":"2026-08-07","category":["tools"]},{"date":"2026-08-06","title":"OpenPhone：港大开源、让 AI 像人一样操作手机","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/AeexrLkWeTM","desc":"小红书笔记（作者 晓来在进化）：港大开源 OpenPhone，面向手机 AI 助手（Mobile Agent）的项目。核心是仅 30 亿参数的视觉语言模型 OpenPhone-3B，专门针对手机操作优化，能识别界面、理解任务、规划操作并在失败后自动修正；配有两套记忆系统（用户使用习惯 + 操作经验），采用端云协同思路（普通任务本地模型完成、复杂任务调云端大模型），并把训练流程、推理代码、评测工具全部开源（GitHub: HKUDS/OpenPhone）。大王补充：智谱去年开源的 9B OpenAutoGLM 和 AutoGLM App 都不好用，不如字节开源的 Midscene（视觉模型驱动的自动化测试框架）。","_fileDate":"2026-08-07","category":["tools"]},{"date":"2026-08-06","title":"OpenAI 开源 Codex Security：Vibe Coding 安全插件（微信文章）","src":"wangziqi9924@gmail.com","link":"https://mp.weixin.qq.com/s/koVsKEyae9grJqrGtsln9g","desc":"微信公众号「数字生命卡兹克」文章：OpenAI 开源 Codex Security（前身是 2025 年 10 月的 Aardvark，GPT-5 驱动的 Agentic Security Researcher），原本封闭在 Codex 生态内，现在外部 Agent 也能调用——Claude Code、Kimi Code、CodeBuddy、Trae、Qoder 等都能装上它扫描产品漏洞；最新已支持 OpenRouter 和 Fireworks，底层漏洞分析模型可换成自己偏好的选择（GitHub: openai/codex-security）。文章起因是作者自己 Vibe Coding 的产品 AIHOT 被持续攻击，意识到安全是 Vibe Coding 被忽略的一环。","_fileDate":"2026-08-07","category":["tools"]},{"date":"2026-08-06","title":"UI Skills：140+ 高质量 UI 设计工程 Skill 库","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/1ldMm8alwQ4","desc":"小红书笔记（作者 LetmeThink）分享的高质量 UI Skill 库，收集 140+ 个设计工程 skills，帮助人类和 Agent 创建更好的界面；对应 GitHub 项目 jakubkrehel/skills（3.2k Star，覆盖动画、UI 打磨、无障碍、产品文案等），使用方式是让 Agent 先运行 npx ui-skills start 选择合适 skill 再动手修改。（图片帖，正文经 OCR 识别：\"UI Skills is a collection of design-engineering skills to help humans and agents create better interfaces\"）","_fileDate":"2026-08-07","category":["skill","tips"]},{"date":"2026-08-06","title":"微博 @AIGC·非著名程序员：视频提示词核心总结模板","src":"wangziqi9924@gmail.com","link":"https://weibo.com/5078115336/5329027074104042","desc":"微博 @AIGC·非著名程序员 总结的视频生成提示词核心方法论：全局规格 + 主体锁定 + 时间轴镜头单元×N + 跨镜连续性 + 全局负向约束；单个镜头单元公式为「时间段 + 景别与机位 + 主体动作 + 摄影机运动 + 声音或对白 + 本镜头结束状态」，其中「本镜头结束状态」最关键，负责把人物位置、朝向、手中物体、动作动势和情绪交接给下一个镜头。文中附可直接复制的完整模板（含全局风格、主体锁定、逐时间段镜头描述、连续性与禁止项清单）。（链接失效/无法访问：微博反爬拦截，说明基于邮件正文）","_fileDate":"2026-08-07","category":["tips"]},{"date":"2026-08-06","title":"微博 @蚁工厂：review 提示词方法论","src":"wangziqi9924@gmail.com","link":"https://weibo.com/2194035935/5329038600312487","desc":"微博博主 @蚁工厂 分享的一条关于 review（AI 代码审查）提示词方法论的微博，邮件正文未展开具体内容，微博页面被反爬拦截无法抓取正文。（链接失效/无法访问：微博反爬拦截，无更多信息）","_fileDate":"2026-08-07","category":["tips"]},{"date":"2026-08-05","title":"MINIMAX-H3 8-12GB 超低显存优化（B站 Work-Fisher）","src":"wangziqi9924@gmail.com","link":"https://b23.tv/zZchz6S","desc":"B站视频（作者 Work-Fisher，播放 2.5 万+）：分享 MINIMAX-H3（MiniMax H3 视频生成模型）在 8-12GB 超低显存下的优化方案，提供云端版（runninghub 工作流合集）和本地版工作流及模型下载，另涉及 H3 一键整合包、首个加速插件（最高加速约 45%）等内容。","_fileDate":"2026-08-07","category":["tips","create"]},{"date":"2026-08-05","title":"VisionPower：为 DeepSeek 量身定制的识图 MCP","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/1ZaVJCqVOQV","desc":"小红书笔记（作者 Run）：DeepSeek V4 Flash 虽能力大幅提升但本质仍是非多模态模型，配置到 Agent 后无法识图看图。VisionPower（GitHub 项目 RunhuaHuang/VisionPower）应运而生，npm 下载量超 3000，可装到任意 Agent 给非多模态大模型\"插上眼睛\"，尤其适配 Claude Code、Codex 等；本次升级支持在 WebUI 直接配置识图模型并内置大量模型预设，点赞关注私信可领 API Key 享受至少半年无限次免费识图（限量 100 人）。","_fileDate":"2026-08-07","category":["tools"]},{"date":"2026-08-05","title":"DeepSeek 内置联网搜索：V4 秒变实时信息 Agent","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/3Rz543nHcVT","desc":"小红书笔记（作者 AI拯救打工人）：DeepSeek V4 Flash 在 Responses API 里内置了 web_search 工具，开发者声明搜索工具即可由服务端完成联网检索、网页获取与结果整理，无需自建搜索抓取流程。适合 AI 新闻追踪、官方文档查询、竞品研究、内容事实核查、企业外部情报等场景；原生搜索偏开箱即用，需要限定站点/时间时可搭配 Tavily、Perplexity 等外部搜索，封装成 fast/external/verify 手开源为 CLI：解决大 PR 偷懒只看部分文件、行号飘、质量不稳定三大问题。确定性工程+Agent 各司其职：精确文件选择、关联文件打包、按文件特征匹配规则、独立 comment 定位。","_fileDate":"2026-08-07","category":["tools"]},{"date":"2026-07-30","title":"风中的厂长：all in AI 的外贸提效实践","src":"wangziqi9924@gmail.com","link":"","desc":"外贸用 AI 提效：文档自动化（PI/报价单/样品单一键生成多语种版本自动排版）、多语种独立站一键生成、AI 美工（即梦会员一个顶十个）、市场分析报告几乎免费。claude 做的报价单审美在线。","_fileDate":"2026-08-07","category":["tips"]},{"date":"2026-07-30","title":"省 Token 实战技巧（多项目并行）","src":"wangziqi9924@gmail.com","link":"","desc":"同时推进几个项目 Token 烧太猛，独立开发者群里学到的方法，最大程度省 token。","_fileDate":"2026-08-07","category":["tips"]},{"date":"2026-07-30","title":"gx：GitHub 仓库无限搜索 CLI","src":"wangziqi9924@gmail.com","link":"https://ohmygh.com","desc":"Rust 单二进制 GitHub 搜索 CLI：匿名只读、永不走系统 DNS、jaq 过滤、ETag 缓存、本地全文索引，为 DNS 被污染的网络与智能体管道设计。","_fileDate":"2026-08-07","category":["tools"]},{"date":"2026-07-30","title":"OpenMinis 开源（手机端 AI Agent）","src":"wangziqi9924@gmail.com","link":"https://github.com/OpenMinis/OpenMinis","desc":"手机上的 AI Agent 工具 OpenMinis 开源，支持 iOS 和安卓。（注：08-03 已收藏 producthunt 版）","_fileDate":"2026-08-07","category":["tools"]},{"date":"2026-07-30","title":"Chrome DevTools 调试 Codex App 技巧","src":"wangziqi9924@gmail.com","link":"","desc":"宝玉xp 分享：1. 退出 Codex App，命令行用 --remote-debugging-port=8315 --remote-allow-origins 启动；2. Chrome 打开 chrome://inspect；3. 点击链接即可打开 Chrome DevTools 调试 Codex App。","_fileDate":"2026-08-07","category":["tips"]},{"date":"2026-07-30","title":"Codex /goal 目标设定技巧","src":"wangziqi9924@gmail.com","link":"http://t.cn/AXJ0DSZu","desc":"Barret李靖：Codex 的 /goal 没有 turn 上限，只要认为目标没完成会一直跑。好目标 = 交付物 + 验收标准 + 约束条件。例：'重写登录接口逻辑，提交 PR，确保 100 并发下 P95 ≤ 120ms，所有测试通过，不引入新依赖'。定义问题的水平决定调度的算力。","_fileDate":"2026-08-07","category":["tips"]},{"date":"2026-07-30","title":"CLAUDE.md 12 条规则（错误率 41%→3%）","src":"wangziqi9924@gmail.com","link":"https://x.com/Mnilax/status/2053116311132155938","desc":"黄建同学：网友基于 Karpathy 4 条规则（Think Before Coding/Simplicity First/Surgical Changes/Goal-Driven Execution）额外加 8 条放进 CLAUDE.md，错误 <script>
const RAW = JSON.parse(document.getElementById('data').textContent || '[]');
const LS_KEY = 'collection_user_entries_v1';
let entries = [];

function init(){
  const local = loadLocal();
  // merge: remote (RAW) as base, local overrides by title+date key
  const key = e => e.date + '|' + e.title;
  const map = new Map();
  RAW.forEach(e => map.set(key(e), Object.assign({}, e, {_remote:1})));
  local.forEach(e => { if(e._del) map.delete(key(e)); else map.set(key(e), Object.assign({}, e, {_local:1})); });
  entries = Array.from(map.values());
  entries.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  updateCount();
  const upd = RAW.length ? RAW[0]._fileDate || '' : '';
  document.getElementById('updated').textContent = upd ? '更新于 ' + upd : '';
  buildFilters();
  buildCatbar();
  render();
}

function loadLocal(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); }catch(e){ return []; }
}
function saveLocal(){
  const loc = entries.filter(e => e._local || e._del);
  localStorage.setItem(LS_KEY, JSON.stringify(loc));
}
function backupLocal(){ saveLocal(); const blob = new Blob([JSON.stringify(entries,null,2)],{type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '收藏备份_'+new Date().toISOString().slice(0,10)+'.json'; a.click(); toast('已导出备份文件'); }
function restoreLocal(){
  const inp = document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange = () => { const f = inp.files[0]; if(!f) return; const r = new FileReader(); r.onload = () => { try{ const data = JSON.parse(r.result); data.forEach(e => { e._local = 1; }); localStorage.setItem(LS_KEY, JSON.stringify(data)); toast('已恢复,刷新生效'); location.reload(); }catch(e){ toast('文件格式错误'); } }; r.readAsText(f); };
  inp.click();
}
function clearLocal(){ if(confirm('确定清空本地修改?远程数据不受影响')){ localStorage.removeItem(LS_KEY); location.reload(); } }

const CATS = [
  {k:'', name:'全部'},
  {k:'skill', name:'🛠️ Skill'},
  {k:'tips', name:'⚡ 使用技巧'},
  {k:'tools', name:'🚀 工具项目'},
  {k:'tutorial', name:'📚 教程课程'},
  {k:'insight', name:'💡 观点认知'},
  {k:'career', name:'💼 职业赚钱'},
  {k:'create', name:'🎬 内容创作'},
  {k:'deals', name:'🎁 羊毛福利'},
  {k:'life', name:'🌱 人生建议'},
  {k:'wisdom', name:'🌊 处世之道'},
  {k:'misc', name:'🗂️ 其他'}
];
function catsOf(e){ const c = e.category; return Array.isArray(c) ? c : (c ? [c] : []); }
let curCat = '';
function catName(k){ const c = CATS.find(x=>x.k===k); return c ? c.name : ''; }
function catClass(k){ return 'b-' + (k||'misc'); }
function fillCatChecks(box, vals){
  const arr = Array.isArray(vals) ? vals : (vals ? [vals] : []);
  box.innerHTML = CATS.filter(c=>c.k).map(c => '<label><input type="checkbox" value="' + c.k + '"' + (arr.includes(c.k)?' checked':'') + '>' + c.name + '</label>').join('');
}
function collectCatChecks(box){
  return Array.from(box.querySelectorAll('input:checked')).map(i => i.value);
}
function buildCatbar(){
  const box = document.getElementById('catbar');
  if(!box) return;
  const total = entries.filter(e => !e._del).length;
  box.innerHTML = CATS.map(c => {
    const n = c.k ? entries.filter(e => !e._del && catsOf(e).includes(c.k)).length : total;
    return '<span class="catchip' + (curCat===c.k?' on':'') + '" onclick="setCat(\'' + c.k + '\')">' + c.name + ' <i>' + n + '</i></span>';
  }).join('');
}
function setCat(k){ curCat = k; buildCatbar(); render(); }
let curFilter = '';
function buildFilters(){
  const srcs = new Set(entries.map(e => e.src).filter(Boolean));
  const box = document.getElementById('filters');
  box.innerHTML = '<span class="chip' + (curFilter===''?' on':'') + '" onclick="setFilter(\'\')">全部</span>';
  Array.from(srcs).sort().forEach(s => {
    box.insertAdjacentHTML('beforeend', '<span class="chip' + (curFilter===s?' on':'') + '" onclick="setFilter(\'' + s.replace(/'/g,"\\'") + '\')">' + esc(s) + '</span>');
  });
}
function setFilter(s){ curFilter = s; buildFilters(); render(); }

function updateCount(){
  const valid = entries.filter(e => !e._del).length;
  document.getElementById('count').textContent = valid + (entries.length > valid ? ' (+' + (entries.length-valid) + ' 待删)' : '');
}
function render(){
  const q = (document.getElementById('search').value || '').toLowerCase();
  const list = document.getElementById('list');
  const out = entries.filter(e => {
    if(curFilter && e.src !== curFilter) return false;
    if(curCat && !catsOf(e).includes(curCat)) return false;
    if(!q) return true;
    return (e.title||'').toLowerCase().includes(q) || (e.desc||'').toLowerCase().includes(q) || (e.src||'').toLowerCase().includes(q) || (e.link||'').toLowerCase().includes(q);
  });
  if(!out.length){ list.innerHTML = '<div class="empty">没有匹配的收藏<br><span style="font-size:12px">试试其他关键词</span></div>'; return; }
  list.innerHTML = out.map(cardHTML).join('');
  // manage list
  const ml = document.getElementById('manage-list');
  if(ml){
    const mout = entries.filter(e => { if(!q) return true; return (e.title||'').toLowerCase().includes(q); });
    ml.innerHTML = mout.map(e => '<div class="card' + (e._del?' dim':'') + '"><div class="date">' + esc(e.date||'') + (e.category ? catsOf(e).map(k => '<span class="badge ' + catClass(k) + '">' + catName(k) + '</span>').join('') : '') + (e._local?' · <span style="color:var(--ok)">本地</span>':'') + (e._del?' · <span style="color:var(--danger)">待删除</span>':'') + '</div><h2>' + esc(e.title) + '</h2><div class="actions"><button class="btn ghost sm" onclick="openEdit(' + entries.indexOf(e) + ')">✏️ 编辑</button><button class="btn danger sm" onclick="toggleDel(' + entries.indexOf(e) + ')">' + (e._del?'↩️ 恢复':'🗑️ 删除') + '</button></div></div>').join('');
  }
}
function cardHTML(e){
  const link = e.link ? '<a class="link" href="' + esc(e.link) + '" target="_blank" rel="noopener">🔗 打开原文</a>' : '';
  return '<article class="card"><div class="date">' + esc(fmtDate(e.date)) + (e.category ? catsOf(e).map(k => '<span class="badge ' + catClass(k) + '">' + catName(k) + '</span>').join('') : '') + '</div><h2>' + esc(e.title) + '</h2>' + (e.src?'<div class="src">📎 ' + esc(e.src) + '</div>':'') + (e.desc?'<p class="desc">' + esc(e.desc) + '</p>':'') + '<div class="actions">' + link + '</div></article>';
}
function fmtDate(d){ if(!d) return ''; const p = d.split('-'); return p.length===3 ? (parseInt(p[1])+'月'+parseInt(p[2])+'日') : d; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function switchTab(t){
  document.getElementById('tab-view').className = t==='view' ? 'on' : '';
  document.getElementById('tab-manage').className = t==='manage' ? 'on' : '';
  document.getElementById('view-pane').classList.toggle('hidden', t!=='view');
  document.getElementById('manage-pane').classList.toggle('hidden', t!=='manage');
  if(t==='manage') render();
}
function openAdd(){
  document.getElementById('modal-title').textContent = '新增收藏';
  document.getElementById('f-idx').value = '';
  document.getElementById('f-title').value = '';
  document.getElementById('f-link').value = '';
  document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
  document.getElementById('f-src').value = '';
  fillCatChecks(document.getElementById('f-cat'), []);
  document.getElementById('f-desc').value = '';
  document.getElementById('modal-mask').classList.add('show');
}
function openEdit(i){
  const e = entries[i];
  document.getElementById('modal-title').textContent = '编辑收藏';
  document.getElementById('f-idx').value = i;
  document.getElementById('f-title').value = e.title || '';
  document.getElementById('f-link').value = e.link || '';
  document.getElementById('f-date').value = e.date || '';
  document.getElementById('f-src').value = e.src || '';
  fillCatChecks(document.getElementById('f-cat'), e.category || []);
  document.getElementById('f-desc').value = e.desc || '';
  document.getElementById('modal-mask').classList.add('show');
}
function closeModal(){ document.getElementById('modal-mask').classList.remove('show'); }
function saveEntry(){
  const idx = document.getElementById('f-idx').value;
  const title = document.getElementById('f-title').value.trim();
  if(!title){ toast('标题不能为空'); return; }
  const obj = {
    date: document.getElementById('f-date').value || new Date().toISOString().slice(0,10),
    title: title,
    link: document.getElementById('f-link').value.trim(),
    src: document.getElementById('f-src').value.trim(),
    category: collectCatChecks(document.getElementById('f-cat')),
    desc: document.getElementById('f-desc').value.trim(),
    _local: 1
  };
  if(idx !== ''){
    const old = entries[parseInt(idx)];
    if(old._remote && !old._local){ // editing a remote entry -> create local override, mark remote as del
      const k = old.date + '|' + old.title;
      entries = entries.filter(e => !(e.date+'|'+e.title === k && e._remote && !e._local));
      obj._local = 1; obj._del = 0;
      entries.push(obj);
    } else {
      entries[parseInt(idx)] = obj;
    }
  } else {
    entries.push(obj);
  }
  entries.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  saveLocal(); closeModal(); render(); buildFilters(); buildCatbar(); updateCount();
  toast('已保存 ✓ (存在本机,导出后可同步)');
}
function toggleDel(i){
  const e = entries[i];
  if(e._del){ delete e._del; } else { e._del = 1; }
  saveLocal(); render(); updateCount(); toast(e._del ? '已标记删除' : '已恢复');
}
function exportAll(){
  const exportData = entries.map(e => { const o = {date:e.date,title:e.title,link:e.link,src:e.src,desc:e.desc}; const cs = catsOf(e); if(cs.length) o.category = cs; return o; }).filter(e => !e._del);
  const blob = new Blob([JSON.stringify(exportData,null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '收藏导出_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  toast('已导出 ' + exportData.length + ' 条');
}
function importAll(){
  const inp = document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange = () => { const f = inp.files[0]; if(!f) return; const r = new FileReader(); r.onload = () => { try{ const data = JSON.parse(r.result); if(!Array.isArray(data)) throw 0; data.forEach(e => { e._local = 1; }); localStorage.setItem(LS_KEY, JSON.stringify(data)); toast('导入 ' + data.length + ' 条,刷新生效'); location.reload(); }catch(e){ toast('格式错误,需为 JSON 数组'); } }; r.readAsText(f); };
  inp.click();
}
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove('show'), 2200); }
init();
</script>
