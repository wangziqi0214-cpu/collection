<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>📮 大王的收藏夹</title>
<style>
:root{--bg:#0f1115;--card:#1a1e26;--card2:#222836;--accent:#e8a33d;--accent2:#4da3ff;--text:#e8e6e3;--sub:#8b919e;--danger:#ff5f57;--ok:#34c759;--radius:14px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;padding-bottom:70px}
header{position:sticky;top:0;background:rgba(15,17,21,.94);backdrop-filter:blur(14px);padding:18px 16px 12px;border-bottom:1px solid #262b36;z-index:20}
header h1{font-size:21px;font-weight:700;display:flex;align-items:center;gap:8px}
header h1 .em{color:var(--accent)}
.meta{display:flex;gap:12px;font-size:12px;color:var(--sub);margin-top:6px;flex-wrap:wrap}
.meta b{color:var(--text)}
.toolbar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.search{flex:1;min-width:150px;background:var(--card);border:1px solid #2a3140;border-radius:10px;padding:9px 12px;color:var(--text);font-size:14px;outline:none}
.search:focus{border-color:var(--accent)}
.chip{background:var(--card);border:1px solid #2a3140;border-radius:20px;padding:7px 14px;font-size:12.5px;color:var(--sub);cursor:pointer;white-space:nowrap;user-select:none}
.chip.on{background:var(--accent);color:#141414;border-color:var(--accent);font-weight:600}
.catbar{display:flex;gap:6px;overflow-x:auto;padding:8px 16px 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.catbar::-webkit-scrollbar{display:none}
.catchip{flex:0 0 auto;background:var(--card);border:1px solid #2a3140;color:var(--sub);font-size:12px;padding:6px 12px;border-radius:16px;cursor:pointer;white-space:nowrap;user-select:none}
.catchip i{font-style:normal;opacity:.55;font-size:11px;margin-left:3px}
.catchip.on{background:var(--accent);color:#141414;border-color:var(--accent);font-weight:700}
.badge{display:inline-block;background:#1c212b;border:1px solid #333a49;color:var(--sub);font-size:10.5px;padding:1px 8px;border-radius:10px;margin-left:6px;vertical-align:1px;font-weight:500}
.badge.b-skill{color:#ffd166;border-color:#4a3f1a}
.badge.b-tips{color:#7dd3fc;border-color:#1e3a5f}
.badge.b-tools{color:#86efac;border-color:#1e4a2f}
.badge.b-tutorial{color:#c4b5fd;border-color:#3b2f6e}
.badge.b-insight{color:#f9a8d4;border-color:#5c2343}
.badge.b-career{color:#fdba74;border-color:#5c3a1e}
.badge.b-life{color:#6ee7b7;border-color:#1f5c44}
.badge.b-wisdom{color:#93c5fd;border-color:#234a7a}
.badge.b-misc{color:#9ca3af;border-color:#374151}
.badge.b-deals{color:#fde68a;border-color:#5c4a1e}
.badge.b-create{color:#f0abfc;border-color:#5c235c}
.catcheck{display:flex;flex-wrap:wrap;gap:6px}
.catcheck label{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid #2a3140;border-radius:8px;padding:7px 11px;font-size:12.5px;cursor:pointer;user-select:none}
.catcheck input{accent-color:var(--accent);width:14px;height:14px}
.catcheck label:has(input:checked){border-color:var(--accent);color:var(--accent);font-weight:600}
.btn{background:var(--accent);color:#141414;border:none;border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid #2a3140;font-weight:500}
.btn.danger{background:rgba(255,95,87,.15);color:var(--danger);border:1px solid rgba(255,95,87,.3)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.list{padding:14px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:var(--radius);padding:14px 14px 12px;border:1px solid #232936;position:relative;transition:opacity .2s}
.card.dim{opacity:.45}
.card .date{font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.5px}
.card h2{font-size:16px;font-weight:650;margin:4px 0 5px;line-height:1.45;padding-right:44px}
.card .src{font-size:12px;color:var(--sub);margin-bottom:6px;display:flex;align-items:center;gap:5px}
.card .desc{font-size:13.5px;color:#c9ccd4;line-height:1.6;margin-bottom:9px}
.card .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .link{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--accent2);text-decoration:none;font-weight:600;padding:4px 0}
.card .link:active{opacity:.7}
.card .del{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,95,87,.3);background:rgba(255,95,87,.08);color:var(--danger);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.card .del:active{background:rgba(255,95,87,.2)}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(15,17,21,.96);padding:9px;text-align:center;font-size:11px;color:var(--sub);border-top:1px solid #262b36;z-index:20}
.empty{text-align:center;color:var(--sub);padding:60px 20px;font-size:14px;line-height:1.8}
/* modal */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal-mask.show{display:flex}
.modal{background:var(--card);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:slideup .25s ease}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal h3{font-size:17px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;background:var(--card2);border:1px solid #2a3140;border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px;outline:none;font-family:inherit}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{min-height:70px;resize:vertical;line-height:1.5}
.modal .row{display:flex;gap:10px}
.modal .row .field{flex:1}
.modal .btns{display:flex;gap:10px;margin-top:16px}
.modal .btns .btn{flex:1;padding:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2a3140;color:var(--text);padding:10px 20px;border-radius:10px;font-size:13px;z-index:100;display:none;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.toast.show{display:block;animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.tabbar{display:flex;border-bottom:1px solid #262b36;margin:0 0 4px}
.tabbar button{flex:1;background:none;border:none;color:var(--sub);font-size:13px;padding:8px 0 10px;cursor:pointer;border-bottom:2px solid transparent}
.tabbar button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.hidden{display:none!important}
@media(min-width:700px){.modal-mask{align-items:center}.modal{border-radius:20px}}
</style>
</head>
<body>
<header>
  <h1>📮 大王<span class="em">的收藏夹</span></h1>
  <div class="meta"><span>共 <b id="count">0</b> 条</span><span id="updated"></span></div>
  <div class="tabbar">
    <button id="tab-view" class="on" onclick="switchTab('view')">👀 浏览</button>
    <button id="tab-manage" onclick="switchTab('manage')">✏️ 管理</button>
  </div>
</header>

<main id="view-pane">
  <div class="toolbar">
    <input class="search" id="search" placeholder="🔍 搜索标题/来源/说明…" oninput="render()">
  </div>
  <div class="catbar" id="catbar"></div>
  <div class="toolbar" id="filters"></div>
  <div class="list" id="list"></div>
</main>

<main id="manage-pane" class="hidden">
  <div class="toolbar">
    <button class="btn" onclick="openAdd()">＋ 新增收藏</button>
    <button class="btn ghost" onclick="exportAll()">📤 导出</button>
    <button class="btn ghost" onclick="importAll()">📥 导入</button>
  </div>
  <div class="toolbar">
    <button class="btn ghost sm" onclick="backupLocal()">💾 备份到本地</button>
    <button class="btn ghost sm" onclick="restoreLocal()">↩️ 恢复备份</button>
    <button class="btn danger sm" onclick="clearLocal()">🗑️ 清空本地</button>
  </div>
  <div class="list" id="manage-list"></div>
</main>

<footer id="foot">每晚 21:00 自动同步 · 数据源:邮箱收藏 + 本地管理</footer>

<div class="modal-mask" id="modal-mask" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="modal-title">新增收藏</h3>
    <input type="hidden" id="f-idx">
    <div class="field"><label>标题 *</label><input id="f-title" placeholder="收藏标题"></div>
    <div class="field"><label>链接</label><input id="f-link" placeholder="https://…"></div>
    <div class="row">
      <div class="field"><label>日期</label><input id="f-date" type="date"></div>
      <div class="field"><label>来源</label><input id="f-src" placeholder="来源/平台"></div>
    </div>
    <div class="field"><label>分类(可多选)</label><div id="f-cat" class="catcheck"></div></div>
    <div class="field"><label>说明</label><textarea id="f-desc" placeholder="为什么值得收藏…"></textarea></div>
    <div class="btns">
      <button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn" id="save-btn" onclick="saveEntry()">保存</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>


<script id="data" type="application/json">[{"date":"2026-08-15","title":"简历怎么写出价值：开源评测集+拉指标，评论区方法论（Badcase 分析切入/三维度拆解/装小白法）","src":"微博@爱可可-爱生活（评论区整理）","link":"https://weibo.com/1402400261/5332111776025381","desc":"微博 @爱可可-爱生活 原帖评论区关于『实习搭了 2 个 Agent 评测集（开源 SWE-bench、VitaBench）、评测 2 个基座模型、拉指标到官方水平』之后简历该怎么写的方向整理。博主困扰：觉得只是跑开源数据没有技术点可写。评论区几类建议：(一)【从 Badcase 分析切入，讨论度最高】别只写『我跑了评测集』，重点写怎么通过分析 Badcase 定位问题、解决差距、最终拉到官方指标；做成 Badcase 分析+据此优化，那这个工作其实叫『模型优化』而非『搭建评测集』，含金量更高。(二)【三维度拆解，方法论视角】从 case 构建、执行边界、对模型的认知三个角度写，侧重讲故事的整体考虑而非罗列跑了几个数据集。可展开：①数据构造——即使是开源数据集，你怎么筛选、分桶、补充测试用例；②测评维度——设定了哪些指标、为什么这些指标能反映模型能力；③效果分析——对比两个基模表现、分析差距产生原因。(三)【装小白法，沟通技巧】想象一个完全不了解大模型的人来听你讲项目，你能否把每个决策背后的原因讲清楚，这能帮你发现那些你认为理所应当但其实体现技术深度的点。⚠️评论区共识：单纯写『我跑了开源评测集』确实没亮点，但深入 Badcase、补数据、调优就有内容可写。关键不在于用什么数据集，而在于你在这个过程中做了什么决策、解决了什么问题、形成了什么方法论。（手机端添加）","_fileDate":"2026-08-15","category":["career"]},{"date":"2026-08-15","title":"简历四个包装方法原文拆解：不堆名词/一个拿得出手的项目/外部信用/反复强调从0到1","src":"微博@爱可可-爱生活（博主笔记原文整理）","link":"https://weibo.com/1402400261/5332111776025381","desc":"承接『开源评测集+拉指标怎么写简历』，博主笔记原文完整拆解简历包装的四个方法（环环相扣：方法二给一个能讲的项目→方法一把项目讲得有技术深度→方法三让招聘者更愿相信→方法四贯穿定调角色定位）。【方法一：不堆名词，写具体决策】差的写法只列关键词（用大模型/Prompt工程/Agent框架/意图分析/混合检索）；好的写法写技术决策——什么条件下触发工具调用、上下文窗口满时怎么压缩、多任务并行时怎么分发、工具调用失败后怎么恢复、对话轨迹用什么指标评测、多个候选结果怎么筛选。核心区别：名词=『我碰过这东西』，流程=『我知道这东西怎么用』。【方法二：必须有一个拿得出手的项目】以阿酥的开源项目 Long-Horizon Agent Harness 为例，简历里不只说『做了个项目』，而是展开技术细节：整体架构设计、子任务调度机制、Skills 的组织方式、记忆模块怎么管理、上下文管理策略。原文结论很粗暴——『10个crud项目也抵不过一个高级项目（看起来而已）』，与其写一堆增删改查，不如集中包装一个看起来有技术深度的项目。【方法三：借助外部信用降低验证成本】第三方认可能帮你加分：开源项目（有人用过、认可你的代码）、技术文章（有总结和思考能力）、比赛成绩（竞争里拿过名次）、大厂实习（其他公司的筛选机制已验证过你）。底层逻辑：招聘者看到这些经历『可能就会被其唬到』，降低对方的验证成本就是降低你被质疑的概率。【方法四：反复强调从0到1】贯穿整个简历的叙事线索——不管实际承担多少，都把自己放在『发起者』和『主导者』位置：不是写『参与了某某项目』，而是写『从0到1搭建了』。原文用『Fake it till you make it』总结：先装成那样，装久了就真成那样了。（手机端添加）","_fileDate":"2026-08-15","category":["career"]},{"date":"2026-08-15","title":"diagram-design：终结AI生成的“廉价感”架构图（Claude Code 插件，repo: cathrynlavery/diagram-design）","src":"微博@爱可可-爱生活","link":"https://github.com/cathrynlavery/diagram-design","desc":"微博 @爱可可-爱生活 分享开发者 Cathryn Lavery 开源的 Claude Code 插件 diagram-design（repo: cathrynlavery/diagram-design）：核心是把 AI 绘图从『能看』提升到『出版级』水平。内置 27 种视觉类型，涵盖从系统架构到复杂的逻辑循环，输出格式为完全自包含的 HTML 和 SVG。最亮眼的功能是品牌匹配：只需输入一个网站 URL，就能自动提取配色方案和字体栈并应用到所有图表中，让 AI 生成的图瞬间像出自专业设计师之手。社区评论认为这种质量足以让同事感到惊艳，也解决了许多开发者『只会写代码却讲不清逻辑』的痛点。这其实代表了 AI 辅助工具的一个新阶段：不再满足于生成凌乱的 Mermaid 草图，而是通过强制 4px 网格、限制视觉密度和科学的配色权重，把审美门槛直接抹平。它让开发者能从繁琐的 Figma 操作中解脱出来，把精力放回系统设计本身，同时保证交付物在演示文稿或博客中具备顶级的视觉一致性。（手机端添加）","_fileDate":"2026-08-15","category":["tools"]},{"date":"2026-08-15","title":"MaxKB：2.1 万 Star 的 AI 工作流编排开源平台，业务人员也能拖拉拽搭智能体（公众号 逛逛GitHub）","src":"公众号 逛逛GitHub","link":"https://mp.weixin.qq.com/s/gy-HkJebGuwi0CuW_Gx81Q","desc":"公众号「逛逛GitHub」推荐的开源项目 MaxKB：让业务人员也能搭 AI 工作流的企业级智能体编排平台，全网累计下载突破 100 万次、GitHub Star 突破 2.1 万，最大特点是简单——工作流编排全靠拖拉拽、不用写一行代码，自带工具商店和模板中心（合同审核、销售报价、CRM 查询等高频场景点一下即用）。大模型接入覆盖本地 DeepSeek、千问 Qwen、Llama 与在线的 DeepSeek、豆包、Kimi、OpenAI、Claude、Gemini，文档上传或自动爬取后拆分、向量化、RAG 全自动，Skills 和 MCP 工具点点就接上；搭好的智能体可零代码嵌入网站、企业微信、微信公众号、钉钉、飞书，并开放 API 供其他应用调用。近一年重点更新：应用模块升级为智能体并新增模板中心、支持按意图自动生成 Python 代码节点、新增基于 {memory} 变量注入上下文的长期记忆。Docker 一行命令即可部署。","_fileDate":"2026-08-15","category":["skill"]},{"date":"2026-08-15","title":"DeepSeek 开源工程 SOP：Harness 仓库 .agents/skills 里 11 个内部工程规范 Skill（微博 @AIGC·非著名程序员）","src":"微博@AIGC·非著名程序员","link":"https://weibo.com/5078115336/5332151479306920","desc":"微博 @AIGC·非著名程序员 拆解 DeepSeek 开源 deepseek-harness 时发现的隐藏宝藏：仓库 .agents/skills/ 目录下藏着 11 个 Skill 文件，都是 DeepSeek 内部真实在用的工程规范，等于把团队工程纪律直接开源，对做 Coding Agent 或工程效能工具的团队比论文更有参考价值。这些 Skill 覆盖六大类：质量门禁（dsh-code-review 要求追踪接口契约、生命周期与并发安全、抽象是否有真实消费者，主张「一个简短的、有实证的 blocker 比一堆 nit 有价值」；dsh-pre-push-checks 按改动范围选最小但足够的本地检查集，全量测试交给 CI）、代码治理（dsh-find-simplifications 给出过度设计的具体判断标准，甚至鼓励引入成熟外部依赖替换手写实现）、文档工程（dsh-doc-site-sync / dsh-doc-standards / dsh-prose-standard，写作哲学是「写够保留契约所需的内容，删掉推理过程、重复和修饰」）、翻译国际化（dsh-translate-docs 中英文档配对同步 + 术语表约束）、AI 特有工程问题（dsh-trim-cot-leakage 清理注释/文档里泄漏的思维链痕迹）、协作流程（dsh-merging-stacked-prs 强制用 GitHub 原生 Stacked PR；record-browser-gif 要求改 UI 的 PR 附真实服务器录制的 GIF 证据链）。本质是给 Coding Agent 用的可执行、可验证的 SOP。微博原帖被反爬拦截，内容基于邮件正文并经 GitHub 页面核实。","_fileDate":"2026-08-15","category":["skill"]},{"date":"2026-08-13","title":"李楠或kkk：Vibe Coding 之后，仍要懂软件工程的三个阶段（计划→迭代→AI辅助/代理）","src":"微博@李楠或kkk","link":"https://weibo.com/1645215240/5331111288766782","desc":"微博 @李楠或kkk 对「AI 辅助编程时代仍需软件工程素养」的脉络梳理。核心观点：很多人玩了一阵 vibecoding 会发现写代码很快，但要把软件长期做对做好，仍得懂软件工程。给出三阶段历史大方向：(1) 计划优先（瀑布流）——《人月神话》即该阶段失败经验的反思，因现实世界会变、沟通会变、组织拖慢，故需更懂管理与协作；(2) 迭代优先（敏捷）——对应需求快速变化，轻计划重迭代，核心是短周期做→快速反馈→再调整的 loop，配合 opensource 的组织迭代形成终极敏捷最佳实践；(3) AI 辅助/代理工作（vibecoding+agent）——AI 产码更快但不是魔法，仍需要前两阶段的工程思想：计划、MVP、loop、敏捷、可维护性、可协作性、TDD 都继承于前两个阶段。作者建议：先记住这个历史大方向，具体问题让 AI 搜索最佳实践才靠谱；任何一个告诉你确定答案的人，其实都不懂 agent。（手机端添加）","_fileDate":"2026-08-15","category":["insight"]},{"date":"2026-08-13","title":"微博 @张岱樾：直接从顶级公司免费学习 AI（10 个官方免费平台）","src":"微博@张岱樾","link":"https://weibo.com/1890573293/5330697557641744（微博分享页）","desc":"微博 @张岱樾 整理的 10 个在顶级 AI/科技公司官网直接免费学 AI 的资源：Anthropic（anthropic.skilljar.com，Claude 官方学习）、Google（grow.google/ai）、Meta（ai.meta.com/resources/，Llama 资源）、NVIDIA（developer.nvidia.com/cuda，CUDA 开发）、Microsoft（learn.microsoft.com/en-us/training/）、OpenAI（academy.openai.com）、IBM（skillsbuild.org）、AWS（skillbuilder.aws）、DeepLearning AI（deeplearning.ai，吴恩达）、Hugging Face（huggingface.co/learn，开源模型学习）。多为英文内容，部分平台需要合理的网络环境才能顺畅访问。（手机端添加）","_fileDate":"2026-08-15","category":["tutorial"]},{"date":"2026-08-13","title":"字节跳动公开 Seedance 2.5 / Seedream 5.0 Pro 导演级分镜文档（微博 @爱可可-爱生活）","src":"微博@爱可可-爱生活","link":"https://weibo.com/1402400261/5331175184533709","desc":"微博 @爱可可-爱生活 分享字节跳动近期公开的 Seedance 2.5 与 Seedream 5.0 Pro 官方提示词文档（bytedance.larkoffice.com/docx/EvLJdw9n8oX1HExDfllcA22jnLe）：把 30 秒长镜头、时间戳精准控制、多素材参考等进阶玩法悉数共享，包含从盛唐夜景到废土科幻的数十套完整案例——精细化到秒级的 Prompt、镜头调度、负面词规避、音效配合都写成可直接复制的分镜剧本。作者点评：这种资源释放宣告靠卖基础 Prompt 赚差价的 AI 收费课失去生存空间；字节此举是通过降低审美与专业门槛，把 AI 视频从随机抽卡推向确定性生产。视频生成瓶颈已不再是工具本身，而是如何像导演一样思考转场与叙事；这套融合摄影美学与工程指令的方法论是当下最有价值的商业资产。（手机端添加）","_fileDate":"2026-08-15","category":["tutorial"]},{"date":"2026-08-13","title":"sv-number：给 Agent 一个能接验证码的真手机号 MCP 服务器（公众号 openvoid）","src":"公众号 openvoid","link":"https://mp.weixin.qq.com/s/XmOMpUsmqIGond4tqiCP0Q","desc":"公众号 openvoid（OpenMCP）2026-08-11 发布，介绍 openvoid 推荐的 sv-number/mcp-server（GitHub 约 490 星）：一个 MCP 服务器，给 Agent 配一个能接验证码的真手机号，接上后有 9 个电话工具（查余额/搜国家/找服务/下单号码/等验证码/完成激活），全程走 stdio API、无 SDK，npx -y sv-number-mcp 一条命令挂上。解决 Agent 自动化流程里「注册要手机号收验证码」的断裂点：list_services 直接按名字搜（不用记 Discord 是 ds 还是 dc，URL/名字都能搜，按匹配度排序）；wait_for_code 每 4 秒自动轮询、最长等 20 分钟、从短信正文自动提取数字验证码；order_number 支持 service+country 一键切换，130+ 国家覆盖；另有 TOTP 本地计算验证码、退款保护（cancel/finish_activation）和 get_balance 余额管理。注意事项：付费服务（需去 sms-verification-number.com 注册充值，无免费额度）、只收不发（不能发短信接电话）、API Key 仅在进程内使用不外泄。同类做成 MCP 服务器的目前仅此一家（其他如 platfone-com/mcp、agentsimdev/agentsim-mcp 都只是个位数 star）。相关资源：GitHub sv-number/mcp-server、官方文档 sms-verification-number.com/en/number-for-ai-agents、Skill 版 sv-number/skills、API 参考 sms-verification-number.com/en/api-sms-activate。（手机端添加）","_fileDate":"2026-08-15","category":["tools"]},{"date":"2026-08-13","title":"needle：14MB 微型基础模型，跑在手机/穿戴/智能家居/机器人上（GitHub @cactus-compute）","src":"微信直发","link":"https://github.com/cactus-compute/needle","desc":"cactus-compute 开源的 needle（GitHub 约 4.3 千 star）：一个仅 14MB 的基础模型，专为微型设备设计——手机、可穿戴设备、智能家居和机器人，把 LLM 能力塞进资源受限的端侧硬件，主打小体积低功耗的本地推理。","_fileDate":"2026-08-15","category":["tools"]},{"date":"2026-08-13","title":"mattpocock/skills：Matt Pocock 的工程师实战 Skills 仓库（GitHub）","src":"微信直发","link":"https://github.com/mattpocock/skills","desc":"Matt Pocock（TypeScript 社区知名作者）的 Agent Skills 仓库（GitHub 约 21.5 万 star），收录他自己 .agents 目录里用于真实工程实践的 skills——从个人工作流里直接提炼，不是教学演示，覆盖实际编码工程场景，可直接装进 Claude Code / Codex 等 Agent 使用。","_fileDate":"2026-08-15","category":["skill"]},{"date":"2026-08-13","title":"codex-host：让 Pi 模型在 Codex Desktop GUI 上运行的插件（GitHub @BytePioneer-AI）","src":"微信","link":"https://github.com/BytePioneer-AI/codex-host","desc":"用户实测 codex-host 插件在 Pi 环境里配合 v4Pro 很丝滑（测过几个 case）：一个能让 Pi 模型运行在 Codex GUI 之上的插件，可以同时享受 Pi 的能力和 Codex Desktop 的 UI。（手机端添加）","_fileDate":"2026-08-15","category":["tools"]},{"date":"2026-08-13","title":"ai-website-cloner-template：Claude 直接复制任何网站界面（微博 @张岱樾）","src":"微博@张岱樾","link":"https://weibo.com/1890573293/5330788409148544（微博分享页）","desc":"微博 @张岱樾 分享的开源项目 ai-website-cloner-template（repo: JCodesMore/ai-website-cloner-template，GitHub 18k 星、完全免费开源）：把目标网址丢进 Claude Code，它就能反向工程整个网站设计——颜色、字体、布局全部复制，拿来即用。支持 Cursor、Copilot、Gemini 以及 10+ 个 AI Agent 工具，是把任意站点界面化成可复用模板的利器。（手机端添加）","_fileDate":"2026-08-15","category":["tools"]},{"date":"2026-08-13","title":"Vibe Coding 后端新手选型：商用项目无脑先上 BaaS，再反向学底层（干货笔记）","src":"微信直发","link":"","desc":"一条关于 Vibe Coding 后端新手选型的干货分享（视频摘要，无链接）。核心结论：做商用项目第一选择无脑先用 BaaS（云后端平台）。(一)平台推荐：海外推 Supabase（免费云端版，付费 25 美元/月起，最火 BaaS）；国内推 Zion BaaS（免费版可体验，付费 99 元/月起，教育权益半价，适配微信小程序场景）。(二)适用人群分三类：商业化开发者 / 做小玩具分享朋友的爱好者 / 想系统学软件开发的学习者。(三)BaaS 核心优势：①运维托管（服务器运维、数据库备份交给平台）；②集成服务（云服务一站式，不用单独开通）；③接入便捷（Supabase 可 MCP/Plugin/CLI 快速连接，Zion 也提供含 MCP、CLI 的 Plugin）。(四)反向学习路径（用 BaaS 做完产品后再学底层）：1.看价格页理解成本——观察流量包/对象存储/数据库/AI tokens/短信为何收费（为什么存图片视频要收费而非放数据库或自己服务器？为何流量不能像家庭宽带按年不限量？为何要 CDN？为何数据库空间收费？为何短信要注册签名加模板？）；2.研究技术栈——如 Supabase 和 Zion 都用 GraphQL API，思考为何不用传统 RESTful；3.动手搭服务端——后端语言（Java/Go/Node.js）、数据库（MySQL/PostgreSQL/MongoDB）、缓存（Redis）、框架（Java 用 Spring Boot、Node.js 用 Nest.js）、部署（普通/Docker）、进阶（事务控制、权限管理）。(五)彩蛋：了解完所有技术后，可能仍觉得 BaaS 最省心。整体提供「先用 BaaS 快速落地，再反向学习底层知识」的高效成长路径，适合想快速做商用项目的开发者。（手机端添加）","_fileDate":"2026-08-15","category":["tips"]},{"date":"2026-08-13","title":"Skill Recorder：微软开源、把操作录制成 Agent Skill（微博 @摇摆时间线ZHLMI）","src":"微博@摇摆时间线ZHLMI","link":"https://weibo.com/1561900137/5331057629203904（微博分享页）","desc":"微博 @摇摆时间线ZHLMI 介绍微软开源的 Skill Recorder：跟 OpenAI Codex 的 Record & Replay、Anthropic Claude Cowork 的 Record a skill 干的是同一件事——录制一次自己完成任务的过程，把它转化为 AI Agent 可重复使用的 Skill。理念是「很多事你自己已做了千百遍、清楚最短路径，没必要让 Agent 重新摸索」，把自己的操作录下来让 Agent 原样复刻即可。关键点：它不是按键精灵（不能乱动桌面、不能乱动窗口大小），而是记录你『想干什么』、先理解意图再把操作翻译成 Agent 的原生工具调用（而非重放 UI 点击），因此具备泛化能力。适合给没有 Record 能力（Codex/Cowork 用不上）的 Agent 工作流补上「教 Agent 走一遍」的能力。（手机端添加）","_fileDate":"2026-08-15","category":["tools"]},{"date":"2026-08-13","title":"MediaCrawler：多平台自媒体爬虫（小红书/抖音/快手/B站/微博/贴吧/知乎）","src":"微信直发","link":"https://github.com/NanmiCoder/MediaCrawler","desc":"MediaCrawler（GitHub 约 6.2 万 star）是一个多平台自媒体数据采集工具：支持小红书笔记/评论、抖音视频/评论、快手、B 站、微博、百度贴吧、知乎问答等主流平台的公开信息抓取，基于 Playwright 浏览器自动化登录保存登录态，爬取笔记、评论、视频、帖子等数据，仅限学习研究用途。","_fileDate":"2026-08-15","category":["tools"]},{"date":"2026-08-13","title":"LabEx：摒弃视频课的交互式技术实验室（Linux/DevOps/网络安全）","src":"微博@爱可可-爱生活","link":"https://weibo.com/1402400261/5331583767938545","desc":"微博 @爱可可-爱生活 推荐的交互式技术实验室 LabEx（labex.io）：整合了原有的 linuxjourney 资源，提供六千多个涵盖 Linux、DevOps、网络安全的实操实验。最大特点是完全去视频化，学习者在浏览器内置的真实终端里直接操作，配合基于 ChatGPT 的 AI 助手解决报错；通过技能树引导，覆盖从基础编程到 CKA、RHCSA 等专业认证的实战练习，核心资源保持开源和免费。价值点：文档与环境深度耦合的模式把学习重心从记忆知识点转向解决具体问题，对想转行或考证的人，低成本的试错空间比高价网课更有含金量。（手机端添加）","_fileDate":"2026-08-15","category":["tools"]},{"date":"2026-08-13","title":"Kronos：首个开源金融 K 线基础模型（GitHub @shiyu-coder）","src":"微信直发","link":"https://github.com/shiyu-coder/Kronos","desc":"开源金融 K 线（candlestick）基础模型 Kronos（GitHub 约 3.7 万 star）：首个开源的金融 K 线语言基础模型，训练数据覆盖 45+ 全球交易所，论文被 AAAI 2026 接收并已上 arXiv，附带开源微调脚本可适配自己的交易任务——用 K 线图做金融时序预测与量化研究。","_fileDate":"2026-08-15","category":["tools"]},{"date":"2026-08-13","title":"Hello-Agents：《从零开始构建智能体》系统教程（Datawhale，GitHub 72.8k star）","src":"手机端添加","link":"https://hello-agents.datawhale.cc/","desc":"Datawhale 社区开源的系统性智能体学习教程《从零开始构建智能体》（GitHub: datawhalechina/hello-agents，约 72.8k star，CC BY-NC-SA 4.0，免费开源，可在线阅读与 PDF 下载）。主张真正构建「AI Native Agent」而非 Dify/Coze/n8n 这类流程驱动的软件工程 Agent，教穿透框架表象、从核心原理出发自研 AI 驱动的智能体。全书五部分十六章：LLM 与 Agent 基础、手把手实现 ReAct/Plan-and-Solve/Reflection 经典范式（含 AutoGen/AgentScope/LangGraph 框架与从零自研 HelloAgents 框架）、高级知识扩展（记忆与 RAG、上下文工程、MCP/A2A/ANP 协议、Agentic-RL 训练实战、性能评估）、综合案例进阶（MCP 多智能体协作、DeepResearch Agent 复现、赛博小镇模拟）与毕业设计。适合有 Python 基础和 LLM 基本了解的自学者、AI 开发者与软件工程师。（手机端添加）","_fileDate":"2026-08-15","category":["tutorial"]},{"date":"2026-08-13","title":"GoodCase.ai：封装3年实测经验的AI提示词案例网站（公众号 卡尔&阿汤）","src":"微信直发","link":"https://mp.weixin.qq.com/s/DrTsNHckOqtoMHJqQyY5Bg","desc":"公众号「卡尔&阿汤」宣布开源 AI 提示语案例网站 GoodCase.ai：作者三年攒的上千条 AI 视频/AI 前端/Agent 生成记录（每条带完整提示语+模型版本+生成效果）整理成经过验证的案例库，第一版用十万积分横测 Seedance 2.0 Fast、MiniMax H3、Wan 3.0 三个 720P 价格接近的模型（136 个 case），覆盖多素材参考生视频（含 Kpop MV 超长提示语）等三类高区分度输入。验证方法论很朴素：先踢掉没提示语的案例，再用同一批提示语跨模型交叉验证，最后把真正跨模型跑通的案例抽象成可复用的 Skill——「选模型没有标准答案，只有适合自己场景的最优解」。（微信文章抓取成功）","_fileDate":"2026-08-15","category":["tools"]},{"date":"2026-08-13","title":"Eta：系统级 Android AI Agent（GitHub @Mangi-11）","src":"微信直发","link":"https://github.com/Mangi-11/Eta","desc":"Mangi-11 开源的 Eta（GitHub 约 1 千 star）：面向 Android 的第三方系统级 AI Agent，号称「可能是目前最强大的系统级 Android AI Agent」——以结构化接口读取本机数据、调用系统 API 并控制设备，配合 GUI Agent 完成必须进入 App 界面的操作（看着屏幕替用户点奶茶），再借助 Root/Linux 环境进入完整计算环境处理复杂任务。理念是 GUI 只是连接封闭 App 生态的兼容层，能直达系统的就走有明确 Schema 的接口调用。","_fileDate":"2026-08-15","category":["tools"]},{"date":"2026-08-13","title":"Beautiful UI：AI 原生界面的 UI 原语资源站（微博 @i陆三金）","src":"微博@i陆三金","link":"https://www.beautifului.dev/","desc":"微博 @i陆三金 推荐的免费 UI 资源站 Beautiful UI（beautifului.dev，MIT License），专为原生 AI 产品打造，主题是 Crafted primitives for AI-native interfaces。收录 19+ 个 AI 原生界面组件/交互模式，直接复制即可用：Loading State（Thinking / Streaming Text）、Approval Card（human-in-the-loop 让 Agent 行动前询问人）、Tool Chips（代码编辑与工具调用折叠成紧凑 chip）、Task Rows（Agent 任务实时状态）、Prompt Bar（@ 资料来源 / / 命令 / 模型选择 / 语音）、Context Cards（检索到的知识块+出处）、Diff Table / Records Table（AI 批量改表）、Code Block（Agent 逐行流式写代码）、Fine-tune Card、Selection Actions（圈选段落交给 Agent 改写）、Insight Cards 等。由 Turbo 产品设计工作室构建，可邮件订阅新组件与更新。（手机端添加）","_fileDate":"2026-08-15","category":["tools"]},{"date":"2026-08-13","title":"AIGC·非著名程序员：LLM 写代码的 bug 变了——简单错误消失、复杂问题浮现","src":"微博@AIGC·非著名程序员","link":"https://weibo.com/5078115336/5331452029571058","desc":"微博 @AIGC·非著名程序员（来自 Bun 创始人 Jarred Sumner 三条推「doesn't happen anymore」与 Anthropic 的 Boris Cherny 的补充讨论）对「LLM 写代码 bug 质变」的梳理。核心观点：LLM 写代码仍会出 bug，但 bug 种类完全不同了。(1) 旧 bug 消失：数组越界、循环多跑/少跑一次、边界值处理等基础逻辑错误基本被模型搞定，几乎不再出现；(2) 新 bug 浮现：转向系统设计层面的问题——架构选择不合理、UI 交互不好用、对整个项目上下文理解不够。写一段函数/实现算法模型已经很靠谱，但要它做工程判断、理解『这个功能放在整个产品里应该怎么设计』时还差点意思。(3) 应对方法『对抗性代码审查』：让 AI 自己挑自己代码的毛病，可写提示词「用动态工作流对抗性地测试每一个边界情况」，或直接用 Claude 内置 /code-review 命令（/code-review low 轻量级、往上还有 medium 等更深模式；low 模式完全不用 agent，高力度模式最多同时调动 10 个 agent 审查）。(4) Boris 反驳「是不是只会堆 token」：每一代新模型完成同样任务需要的 token 在变少，帕累托前沿一直在往左移动，同样效果成本在降低。(5) 社区关切：模型编码能力增强，写作能力与个性表达是否退步，是待观察的取舍。(6) 技巧：有人对抗性审查喜欢换完全不同模型家族来审效果最好；Boris 建议先试 /code-review low，其内部评测表现比其他模型好且成本不到一美分。总结：AI 写代码正经历质变，低级 bug 时代过去，进入关注更高层问题的阶段。（手机端添加）","_fileDate":"2026-08-15","category":["insight"]},{"date":"2026-08-13","title":"AI Agent 架构：从单体到企业级多智能体（Wayland Zhang，在线阅读）","src":"手机端添加","link":"https://waylandz.com/ai-agent-book/","desc":"Wayland Zhang（waylandz.com，著有《LLM Transformer:From Zero to One》《AI Quantitative Trading》等）开源的多智能体架构教程《AI Agent 架构：从单体到企业级多智能体》，提供中/英/日多语言在线阅读。全书 8 个 Part 24 章，系统覆盖：Agent 基础（ReAct 循环）、工具与扩展（MCP 协议、Skills、Hooks）、上下文与记忆、单 Agent 模式（Planning/Reflection/CoT）、多 Agent 编排（DAG 工作流、Swarm 模式、Handoff 机制）、高级推理（Tree-of-Thoughts、Debate）、生产架构（Temporal 工作流、可观测性）与企业级特性（Token 预算控制等）。与李博杰《深入理解 AI Agent》互补：后者偏原理与工程实践，此书更聚焦多智能体编排与生产级/企业级落地的架构模式与实战。（手机端添加）","_fileDate":"2026-08-15","category":["tutorial"]},{"date":"2026-08-12","title":"经过第一轮招聘 对学历祛魅了：AI 团队招人只看 demo（小红书）","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/1lsRW6Ea8HF","desc":"小红书笔记（AI 初创团队招聘分享）：耗时 4 天、招人模式迭代 3 次，从最开始看简历进化到 V3.0 只看 demo——应聘者以视频/网址/压缩包形式投递作品，看中直接进终面、省掉冗长沟通；没看到能力展示之前不想回答问题，认为同样时间拿去 BD 比招聘性价比更高。团队要的是复合型人才（\"不想当设计的前端不是好产品\"）、不要螺丝钉，正在招募核心成员，称薪资不是问题。","_fileDate":"2026-08-15","category":["career"]},{"date":"2026-08-12","title":"微博 @tombkeeper：勇敢接受工作挑战，让人快速成长","src":"wangziqi9924@gmail.com","link":"https://weibo.com/1401527553/4385033605017185","desc":"微博 @tombkeeper 分享刚参加工作时的心得：部门接到各类任务，领导问能不能干，他一般都说「让我去试试吧」，然后抓紧时间查资料学习相关内容。核心观点：勇敢接受工作挑战可以让人快速成长，也会带来更多机会，这是马太效应——当时领导给他的评语是「不管什么工作，交给你我就放心了，反正你总有办法搞定」；当然也要了解清楚需求，特别是对时间的要求，评估好是否在自己跳一跳能够得着的范围内。（链接失效/无法访问：微博反爬拦截，说明基于邮件正文）","_fileDate":"2026-08-15","category":["career"]},{"date":"2026-08-12","title":"微博 @AIGC·非著名程序员：「Token 不限量」实验的七条观察","src":"wangziqi9924@gmail.com","link":"https://weibo.com/5078115336/5330707804850190","desc":"微博 @AIGC·非著名程序员 分享一个二十多人 AI 团队拿约百万美元预算做「Token 不限量」实验后的七条观察：Token 管够后效率瓶颈撞在人身上（成员单日最高烧约 7000 美元、产出却没跟着翻倍）；AI 上限取决于传统组织能否完成从 0 到 1 的 AI 化；员工反而更累（中位数同时开约 5 个 session、工资不变活变多）；贵模型不是万能、按任务难度做模型路由更划算；会议少近八成但「AI 跟 AI 对话」让团队共同理解变浅；沟通转向异步离线、信息失真累积。结论是这更像一场穿着技术实验外衣的管理问题——别数烧了多少 Token，要量 AI 有没有减轻人的认知负荷、同时增强团队的共同理解。（链接失效/无法访问：微博反爬拦截，说明基于邮件正文）","_fileDate":"2026-08-15","category":["insight"]},{"date":"2026-08-12","title":"『所有的无用，都是有用的』（微信公众号文章）","src":"wangziqi9924@gmail.com","link":"https://mp.weixin.qq.com/s?__biz=MzI0NDA5MDYyNA==&mid=2648257269&idx=1&sn=e0d43ff220c616ab1c5899bd06d97f59","desc":"微博分享的微信公众号文章，标题为「所有的无用，都是有用的」。正文被微信验证页拦截（环境异常/verify 页），无法抓取更多内容。（链接失效/无法访问：微信验证页拦截，无更多信息）","_fileDate":"2026-08-15","category":["insight"]},{"date":"2026-08-12","title":"nie-grassroots-logic：把《基层中国的运行逻辑》做成可执行 AI Skill（微博 @蚁工厂）","src":"wangziqi9924@gmail.com","link":"https://weibo.com/2194035935/5330733469273885（微博分享页）","desc":"微博 @蚁工厂 分享的开源项目 ayi-ai/nie-grassroots-logic（MIT 协议、14 个模块）：把聂辉华《基层中国的运行逻辑》一书提炼成可执行 AI Skill，把县乡村治理框架（条块、含权量、双均衡、三座大山…）整理成可被 Cursor / Claude Code / Codex / Grok 反复调用的方法论工具箱——用来解释地方新闻与权力结构，也用来辅助求学、考公、投资、养老、创业等个人选择。仓库不含原书全文，设计原则是提纯结构不写摘要、保留作者精确命名、按需懒加载。（微博链接被反爬拦截，GitHub 仓库抓取成功）","_fileDate":"2026-08-15","category":["skill"]},{"date":"2026-08-12","title":"linux.do 话题 2629870","src":"微信直发","link":"https://linux.do/t/topic/2629870/8","desc":"LINUX DO 论坛帖子链接（第 8 楼回复），Cloudflare 防护 + 登录墙导致无法抓取内容（无法访问）。","_fileDate":"2026-08-15","category":["misc"]},{"date":"2026-08-12","title":"Cloudflare Mesh：赛博菩萨版 Tailscale，免费 50 节点（小红书）","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/3fk4M9yKxtK","desc":"小红书笔记介绍 Cloudflare Mesh（博主称之为「Cloudflare 版 Tailscale」）：一个能把全球各地的手机、电脑、服务器甚至 AI 机器人全部拉进同一个「加密局域网」的组网工具，类似 Tailscale 的异地设备互联能力。免费额度很香——每个账号直接送 50 个节点 + 50 个用户，中小团队或个人白嫖完全够用；体验路径是 Cloudflare 后台点击 Network → Mesh 开启。","_fileDate":"2026-08-15","category":["tools"]},{"date":"2026-08-11","title":"微博 @神嘛事儿：装 OpenClaw 能自己开发的 20 个实用功能","src":"wangziqi9924@gmail.com","link":"https://weibo.com/1670458304/5329711253162461","desc":"微博 @神嘛事儿 分享「很多人不知道 AI 咋用，装一个 OpenClaw 就能自己开发很多以前要花钱的功能」，列举 20 个例子：新闻联播热词量化、导出支付宝/微信账单做财务分析、健身小软件、定时提醒、实时翻译字幕、儿童学习软件、对话心理分析、商品价格曲线监控、浏览器实时翻译插件、给父母做请安提醒、读体检报告、儿童上网干预、午餐热量决策、发票收集、HR 简历筛选软件、财务数据分析防裁员、业务单据化 RPA、老板经营日报、出租闲置算力、销售拜访简报。称每一条「几句话就可以搞定、成本不超过 10 元」。（链接失效/无法访问：微博反爬拦截，说明基于邮件正文）","_fileDate":"2026-08-15","category":["career"]},{"date":"2026-08-11","title":"【投资】量化交易实盘记录+答疑（LINUX DO）","src":"微信","link":"https://linux.do/t/topic/2208615","desc":"- **关于 AI**：适合作为学习和代码构建工具，不适合全权交给它做交易。","_fileDate":"2026-08-15","category":["misc"]},{"date":"2026-08-11","title":"tracecite-mobile：AI 自动分析手机运行日志（小红书 @大熊猫）","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/3iGueIztNnS","desc":"小红书笔记（作者：大熊猫）介绍移动端开发日志分析工具 tracecite-mobile：解决「Bug 复现→连手机→导出海量日志→手动搜关键字找根因」的痛点，iPhone/Android 插上后通过 adb / idevicesyslog 直连真机自动采集运行日志，Agent 接手分析——自动定位事发时间窗、搜关键字、归类过滤，最后把结论整理好给开发者。","_fileDate":"2026-08-15","category":["misc"]},{"date":"2026-08-11","title":"i-have-adhd：1.8 万星的 AI 回答规范 Skill（公众号 逛逛GitHub）","src":"wangziqi9924@gmail.com","link":"https://mp.weixin.qq.com/s/_Peb1KkjGP-KZchE5vYVgw","desc":"公众号「逛逛GitHub」介绍 GitHub 1.8 万+ star 的开源项目 i-have-adhd（repo: ayghri/i-have-adhd）：核心是一份约束 AI 回答顺序的 SKILL.md，不训练模型、不改编程能力，只调整信息出现的顺序和拆解粒度。10 条规则核心三件事——答案放前面、步骤编号、随时说明进度，删掉客套话和多余展开；保留安全规则（危险操作先确认、连续失败三次停止重试）。支持 Claude Code、Codex、Qwen Code、Gemini CLI、Antigravity，可临时调用也可设为每次会话自动加载（如 touch ~/.claude/.i-have-adhd-always）。","_fileDate":"2026-08-15","category":["skill"]},{"date":"2026-08-11","title":"Qwen-MM-Plugins：让 Agent 具备多模态原生能力的插件集（GitHub）","src":"微信","link":"https://github.com/QwenLM/Qwen-MM-Plugins","desc":"QwenLM 官方开源的多模态插件仓库（约 1.3k star），口号 Make any agent harness multimodal-native。每个能力 = 一个 skill（让模型知道工具存在）+ 可选 MCP server（工具本体，uvx 按需启动），独立安装互不干扰。能力清单：core（图像/视频/文档/3D 模型的动态分辨率读取、OCR、grounding、分割、ASR、视觉对话、网页搜索）、video-memory（长视频分层图记忆，支持超长视频问答）、omni-av（全模态音视频理解，含时间戳 ASR、事件计数、音乐打标）、video-edit（视频编辑 + 图像/视频/音频生成）、blender（驱动运行中的 Blender 做 3D 建模，22 个工具）、freecad（驱动 FreeCAD 参数化建模，14 个工具）、edu-agent（把数学/科学题转成中文分步讲解视频，仅 skill）。提供一键安装脚本，支持 Claude Code、Codex、Qoder、OpenClaw、Qwen Code、Gemini CLI 等主流 harness，Windows 需 WSL2。","_fileDate":"2026-08-15","category":["skill"]},{"date":"2026-08-11","title":"Cloudflare：Agent 部署免注册、60 分钟临时账号一键转永久（小红书 @呆呆马AI）","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/uJueD358f1","desc":"小红书笔记（作者：呆呆马AI）介绍 Cloudflare 新能力：AI Agent 部署东西连账号都不用注册，直接跑一行命令、几秒钟就能拿到一个真实可访问的 Worker，默认 60 分钟临时账号，用完还能一键认领转永久。AI 写代码直接部署上线，是 Vibe Coding / Codex 工作流的好搭档。","_fileDate":"2026-08-15","category":["misc"]},{"date":"2026-08-11","title":"AirTap：住在 iMessage 里的 AI 手机助手（公众号 龙说效率）","src":"wangziqi9924@gmail.com","link":"https://mp.weixin.qq.com/s/kRm-WxNnchU01ts4_zNPAw","desc":"公众号「龙说效率」介绍 AirTap（官网 airtap.ai，口号 Text your apps）：住在 iMessage 短信里的 AI 代理，发条消息就替你点屏幕、打字、滑动，不调任何 App API，而是用计算机视觉「看着屏幕」像真人一样操作，任何有图形界面的 App 都能用。三层架构：大脑（Airtap AI Cloud，不锁死模型，可通过 SKILLS.md 接 Claude/Codex/OpenClaw）、双手（AutoPilot 视觉操控）、设备（美国云手机 24 小时在线或本地物理机）；不用装 App、不用科学上网，隐私上不存密码、密码框加密屏蔽、云手机隔离、退出即擦除。可接进 OpenClaw（openclaw skills install @skills-airtap/airtap），让 AI 从「只能想」变成「能帮我做」。","_fileDate":"2026-08-15","category":["skill"]},{"date":"2026-08-10","title":"用 LLM 学习复杂主题：把知识库变成游戏化模拟（微博 @蚁工厂）","src":"wangziqi9924@gmail.com","link":"https://weibo.com/2194035935/5330284199546547（微博分享页）","desc":"微博 @蚁工厂 推荐工程师 Laurențiu Răducu 的博文《How I use LLMs to learn complex topics》：作者觉得 LLM 解释太浅显难记，改用「先建知识库、再改造成游戏化可视化项目」的学习法。流程：计划模式下让模型为主题建立基础知识库 → 让它复核准确性 → 用 low-poly 过山车大亨风格动画做该主题的模拟（要求响应式、可暂停控制）→ 推到 GitHub Pages。实例 ChipTycoon 带玩家从采砂到芯片交付数据中心全程走一遍，作者还做了火箭发动机、LLM 原理（token-town）、F1 发动机、EUV 光刻机等系列模拟站，并把图片转 3D 的 Skill（unreal-game-assets-creation-skill）与生成学习动画的 learnscape SKILL.md 一并开源。（微博链接被反爬拦截，博客抓取成功）","_fileDate":"2026-08-15","category":["skill"]},{"date":"2026-08-10","title":"微博 @宝玉：小版本快速迭代的开发流程（无链接）","src":"wangziqi9924@gmail.com","link":"","desc":"微博 @宝玉 分享自己的开发流程：基于小版本快速迭代的模式，每次只做一个小版本（一点小功能 + bug 修复），代码量少、相对好规划好测试验收；从最小可行版本（MVP）开始，每个功能先做原型，原型 OK 就让 AI 写代码，写完测试、测试没问题就发布。（链接失效/无法访问：邮件正文无链接）","_fileDate":"2026-08-15","category":["misc"]},{"date":"2026-08-10","title":"微博 @tombkeeper：汉族内部可分 7 个基因亚群","src":"wangziqi9924@gmail.com","link":"https://weibo.com/1401527553/5330481321348283","desc":"微博 @tombkeeper 分享基因视角的观点：从基因来看汉族内部可分北方、西北、东部、中部、南方、东南、岭南 7 个亚群，很多少数民族甚至其它国家和汉族的基因差异还不如汉族内部亚群之间的差异大，例如山东人和广东人的差异比山东人和韩国人的差异更大。（链接失效/无法访问：微博反爬拦截，说明基于邮件正文）","_fileDate":"2026-08-15","category":["insight"]},{"date":"2026-08-10","title":"分享我常用的 Vibe Coding 灵感和利器（小红书 @Sen.md）","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/6NFmq5Tse9l","desc":"小红书博主 Sen.md 整理的 Vibe Coding 常用资源与工具清单：Cuelume（给网页添加交互音效的轻量声音库，内置 14 种实时合成提示音）、Paper Shaders（React Shader 组件库，可直接用纸张纹理、液态金属、网点、渐变和噪声等效果）、21st.dev（收录 12,000+ React 组件、模板和 shadcn 主题，复制 Prompt 就能让 Agent 写入项目）、Deck Gallery（演示文稿灵感图库，涵盖 Pitch、品牌规范、报告和作品集）、Brand Archive（历史与当代品牌视觉资料库，可查 Logo、字体、配色和应用案例）、The Index（收录全球设计工作室、设计师和字体厂牌，适合找合作对象和视觉参考）、Refero Styles（收录 2,000+ 套产品网站设计系统，并整理成 AI 可读的 DESIGN.md）、Taste Lab（从任意网站反向提取设计品味的 Skill，生成 Design Map 和 Taste DNA）。","_fileDate":"2026-08-15","category":["skill"]},{"date":"2026-08-10","title":"乔木的 Skill 推荐站 skills.qiaomu.ai（微博 @蚁工厂）","src":"wangziqi9924@gmail.com","link":"https://skills.qiaomu.ai/","desc":"微博 @蚁工厂 推荐乔木维护的 Agent Skill 站 skills.qiaomu.ai（「Skill 推荐网 / Agent Skills Directory」）：只放少而精的 skill，从公开榜单和 GitHub 原文里挑选，先看用途再看热度、装上就用；站上现显示收录 239 个 Skill（微博转发时称 333 个，数量滚动更新），每个分类一般不超过 10 个，另有安装榜、社区榜、乔木库和专题合集视图。（站点抓取成功，微博链接被反爬拦截）","_fileDate":"2026-08-15","category":["skill"]},{"date":"2026-08-10","title":"anti-detect-browser-skills（GitHub）","src":"wangziqi9924@gmail.com","link":"https://> GitHub 开源项目 antibrow/anti-detect-browser-skills：启动和管理反检测浏览器（anti-detect browser），为每个浏览器实例赋予独特的真实设备指纹，用于多账号运营、网页爬取、广告验证和 AI Agent 自动化等场景。","desc":"","_fileDate":"2026-08-15","category":["skill"]},{"date":"2026-08-10","title":"Zhihu CLI：知乎官方 Agent 命令行工具（微博 @蚁工厂）","src":"wangziqi9924@gmail.com","link":"https://zhuanlan.zhihu.com/p/2068355085243871946（官方介绍文）","desc":"微博 @蚁工厂 分享知乎数据开放平台面向 AI Agent 推出的官方命令行工具 Zhihu CLI：把配套 Skill 交给 Agent，就能搜索知乎和全网内容、查看知乎热榜、调用知乎直答，目前免费调用额度 5000 次/天。邮件内短链 http://t.cn/AXNVRm0w 已失效（403），经搜索确认官方介绍与功能。（链接失效/无法访问：原短链失效，说明基于邮件正文与搜索到的官方信息）","_fileDate":"2026-08-15","category":["skill"]},{"date":"2026-08-10","title":"Workflo：永不看屏幕的 Mac 工作区自动化（Product Hunt）","src":"wangziqi9924@gmail.com","link":"https://www.producthunt.com/products/workflo-2","desc":"Product Hunt 本周上线的 Mac 工作区自动化工具：自动在会议或专注时段前摆好需要的窗口（Scenes），显示器插拔时恢复布局（Desks），一键热键暂存/恢复屏幕（Stash）。设计上只用 Accessibility 权限、结构上无法读取屏幕内容（不申请录屏权限），原生 Swift 约 4MB、一次性买断 $19.99（首发 20% 折扣），纯本地运行、不收集不传输任何数据。","_fileDate":"2026-08-15","category":["misc"]},{"date":"2026-08-10","title":"VoiceOS：语音驱动电脑操作 + 语音原生 App 商店（Product Hunt）","src":"wangziqi9924@gmail.com","link":"https://www.producthunt.com/products/voiceos","desc":"YC 背景的 VoiceOS 是系统级\"语音到操作\"工具（Mac/Windows）：自然说话即可跨应用执行工作流，执行前带快速确认步骤，免去频繁切换 App。本次发布的是 VoiceOS App Store（当日 Product Hunt 排名第 2）：用一句话描述（如\"创建一个帮我写日记的 App\"）即可生成语音原生应用，分享链接让任何人一键安装，支持自动更新，也可让 Claude 或 Codex 继续编辑应用逻辑。","_fileDate":"2026-08-15","category":["misc"]},{"date":"2026-08-10","title":"Toolport：解决 AI Agent 工具列表膨胀的本地 MCP 网关（Product Hunt）","src":"wangziqi9924@gmail.com","link":"https://www.producthunt.com/products/conduit-12","desc":"Product Hunt 本周登场的免费开源本地 MCP 网关：每个 MCP 服务器都会把完整工具列表塞进每次请求的上下文（接 3 个服务器就要吃掉约 24k tokens），Toolport 把它们统一放在一个本地网关后面，只暴露 4 个按需搜索的 meta-tools，实测工具开销降低 97%、token 减少约 90% 且任务成功率不变。密钥存在系统钥匙串而非客户端配置，可标记工具投毒和危险调用并等待人工确认；支持 Claude、Cursor、Codex、VS Code 等 33 种客户端，MIT 协议、全本地运行，Windows/macOS/Linux 三平台，当日 Product Hunt 排名第 5。","_fileDate":"2026-08-15","category":["misc"]},{"date":"2026-08-10","title":"NVIDIA NemotronLabs VoiceChat 11B：开源全双工语音对话模型（MarkTechPost）","src":"wangziqi9924@gmail.com","link":"https://www.marktechpost.com/2026/08/09/nvidia-releases-nemotronlabs-voicechat-11b-an-open-full-duplex-speech-to-speech-model-with-450-ms-turn-taking-and-live-tool-calling/","desc":"NVIDIA 开源的 11B 端到端语音到语音（speech-to-speech）模型：用单一统一网络替代 ASR+LLM+TTS 级联架构，实测平滑轮转延迟 448ms，支持边听边说、中途打断（480ms 打断接管率 1.00），是首个支持对话中工具调用的开源全双工模型——通过旁路 TOOLCALL 通道输出工具脚本，并用运营商定义的 on-hold 话术填补 API 等待时间。需 80GB 显存 GPU（A100/H100/RTX 6000 Pro 等），NVIDIA 标注为\"仅研究用途\"，暂无托管 API，在 Full-Duplex-Bench 1.0 上排名开源模型第 2。","_fileDate":"2026-08-15","category":["misc"]},{"date":"2026-08-10","title":"Karpo：盯上年轻人城市生活的主动式 AI（微信公众号 虾蛄内容部）","src":"wangziqi9924@gmail.com","link":"https://mp.weixin.qq.com/s/lNAi2buD4AAHCEokXaIVyw","desc":"公众号「虾蛄内容部」报道 MachinePulse 推出的主动式 AI 出行产品 Karpo：住在 iMessage 里的生活助理，像给朋友发短信一样提问即可获得建议，覆盖餐厅、演出、派对、展览、酒吧、周末安排和旅行计划等本地生活场景，支持通过 Klook、Viator 等完成预订，AI 还能代表用户给商家打电话询问位置、价格和排队情况。团队核心成员来自字节跳动（豆包）、Amazon、PayPal、阶跃星辰，已获 Creekstone Ventures、高瓴创投、蓝驰创投等数千万美元融资、估值近 1 亿美元；同时开源了让 Agent 感知新闻/天气/市场/GitHub 等外部信号的 World2Agent 项目（GitHub 约 1200 star）。","_fileDate":"2026-08-15","category":["misc"]},{"date":"2026-08-10","title":"CodeGraph：预索引代码知识图谱，帮 Agent 省 token（微博 @我是一只小小小鸡仔）","src":"wangziqi9924@gmail.com","link":"https://github.com/colbymchenry/codegraph","desc":"微博 @我是一只小小小鸡仔 分享开源工具 CodeGraph（repo: colbymchenry/codegraph，约 6.6 万 star）：把代码库从「文件集合」转换成「可查询的关系图」，帮助 AI 更快理解大型项目，从而节省 Code Agent 的 token 和工具调用次数。预索引（pre-indexed）、代码变更自动同步，100% 本地运行，支持 Claude Code、Codex、Gemini、Cursor、OpenCode、AntiGravity、Kiro、Hermes Agent 等主流 harness。（原短链 t.cn/AXiNlkta 已解析到 GitHub 仓库，抓取成功）","_fileDate":"2026-08-15","category":["misc"]},{"date":"2026-08-09","title":"阿里高德 Agent 团队开源 LongHorizon-Harness（小红书）","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/Ab4uSf8WaWU","desc":"小红书笔记（作者：王鹏LLM）介绍高德 Agent 团队（AMAP-ML）开源的 LongHorizon-Harness：一套让 Agent 在真实电脑环境中像人一样操作整台计算机、跨桌面 App/浏览器/命令行持续工作数十小时并保持目标不漂移的执行系统，支持点击输入滚动、操作表格文档设计与 3D 软件、写代码跑命令装环境调系统，不绑定模型与 Agent 后端（可接 Claude、GPT、Qwen 及 Claude Code、Codex CLI、OpenClaw）。实测 GUI 与 CLI 混合任务完成率从约 50% 提升至约 80%，长时桌面任务完整完成率提升至 3 倍，代码与命令行任务成功率从 69.7% 提升至 77.2%，同时减少 24% 的 token 消耗，论文见 arxiv.org/abs/2608.01964。","_fileDate":"2026-08-15","category":["misc"]},{"date":"2026-08-09","title":"抖音视频：王波粒「我做的两个 App，两次改变了我的人生轨迹」","src":"wangziqi9924@gmail.com","link":"https://v.douyin.com/6bE4fByqB2Y/","desc":"抖音作者 @王波粒 的分享视频，讲述他做过的两个 App 如何两次改变他的人生轨迹（主题含「#锤…」字样）。页面为 JS 加密反爬，抓不到视频页正文，说明基于邮件正文。（链接失效/无法访问：抖音页面反爬，无更多信息）","_fileDate":"2026-08-15","category":["life"]},{"date":"2026-08-09","title":"微博 @梁州Zz：日常找选题的流程分享","src":"wangziqi9924@gmail.com","link":"https://weibo.com/2661864314/5329751712471153","desc":"微博 @梁州Zz 分享其日常找选题的流程：先从日常熟悉但细想有疑惑的现象出发，追问它如何形成、背后是否有被忽略的历史/地理/权力线索；进入选题后二筛——看现象是否经历过明显历史转折、能否连接文学地理制度与普通人生活，只有能挖出足够多「地层」的题目才入选；再沿时间轴分别找史料、文学、地理、制度与人物作支撑，最后反复核对材料间的因果关系，解释「为什么偏偏在这个时代发生变化」。微博页面被反爬拦截，说明基于邮件正文。（链接失效/无法访问：微博反爬拦截）","_fileDate":"2026-08-15","category":["life"]},{"date":"2026-08-09","title":"微博 @宝玉xp：怎么用好 Agent 的 /goal 功能","src":"wangziqi9924@gmail.com","link":"https://weibo.com/1727858283/5329579549656926","desc":"微博 @宝玉xp 分享 Agent 的 /goal 功能用法：给 Agent 一个目标让它长时间运行直到完成，关键是三点——明确目标、如何验证结果、停止条件。他以性能优化任务为例（Fable 5 帮他把视频转录性能优化了 2 倍多），提示词里先让 Agent 用测试视频建立基准，再分析瓶颈反复优化、对照基准看效果，结束条件设为「觉得没有优化空间」，而不是给出具体指标。微博页面被反爬拦截无法抓取正文，说明基于邮件正文。（链接失效/无法访问：微博反爬拦截）","_fileDate":"2026-08-15","category":["tips"]},{"date":"2026-08-09","title":"微博 @刘小波的博：人要有站街女精神","src":"wangziqi9924@gmail.com","link":"https://weibo.com/6167988003/5329707559294769","desc":"微博 @刘小波的博 的观点：人要有「站街女精神」——主动走到机会面前问「我可以吗」，接受拒绝和被挑选，然后赚钱；不要觉得被人挑选是耻辱，在好机会面前被挑选会越来越好。作者强调只是取其「主动争取、不怕被拒」的精神而非字面意思。微博页面被反爬拦截无法抓取正文，说明基于邮件正文。（链接失效/无法访问：微博反爬拦截）","_fileDate":"2026-08-15","category":["career"]},{"date":"2026-08-09","title":"微博 @Barret李靖：组织朝 AI 转型，首先要解决人的意识问题","src":"wangziqi9924@gmail.com","link":"https://weibo.com/1812166904/5329590125859467","desc":"微博 @Barret李靖 的观点：组织向 AI 转型首先解决人的意识问题。AI 开始补齐人的短板，使越来越多的人具备端到端交付能力（不止全栈技术，还包括需求洞察、产品运营和市场推广）；如果人的意识仍停留在「你有你的地盘、我有我的地盘」的专业分工，AI 用上了组织却还是原来的组织。意识转变后，每个人会往前后延伸考虑上下游衔接、让 AI 补齐依赖别人的工作、把自己的经验转化为 AI 可理解可执行可复用的工作流。微博页面被反爬拦截，说明基于邮件正文。（链接失效/无法访问：微博反爬拦截）","_fileDate":"2026-08-15","category":["tips"]},{"date":"2026-08-09","title":"微博 @Barret李靖：测试和前端等细分工种正被 AI 收敛","src":"wangziqi9924@gmail.com","link":"https://weibo.com/1812166904/5329592828038397","desc":"微博 @Barret李靖 观察：测试和前端开发等细分工种正在逐渐被收敛。今天研发流程仍是 Human in the Loop，更理想的状态是 Human over the Loop——人逐渐脱离具体工作流，让任务自循环、自验证、自进化，核心要解决「验证」问题：AI 生产速度一定超过人的验收速度，验证本身也必须交给 AI；当大量任务的生产验收都发生在 Agent 之间，面向人的前端表达需求会减少，前端工作将从「怎么让人更好地操作系统」转向「怎么让人更好地控制 Agent」。微博页面被反爬拦截，说明基于邮件正文。（链接失效/无法访问：微博反爬拦截）","_fileDate":"2026-08-15","category":["misc"]},{"date":"2026-08-09","title":"《深入理解 AI Agent》开源书：设计原理与工程实践（微博 @张岱樾）","src":"wangziqi9924@gmail.com","link":"https://weibo.com/1890573293/5329746541679580","desc":"微博 @张岱樾 推荐一本没什么技术背景也能看懂的《深入理解 AI Agent》（李博杰 著）。开源主仓库 bojieli/ai-agent-book 包含全书正文、编译版 PDF 与按章配套代码，适合想系统入门 AI Agent 原理与工程实践的读者。微博正文被反爬拦截，说明基于邮件正文。（微博链接失效/无法访问：微博反爬拦截）","_fileDate":"2026-08-15","category":["misc"]},{"date":"2026-08-09","title":"π-agent book：讲透 Pi agent 源码的书（微博 @蚁工厂）","src":"wangziqi9924@gmail.com","link":"https://weibo.com/2194035935/5329630223667687","desc":"微博 @蚁工厂 推荐《π-agent book》（books.antinomie.org/pi/）：一本把 Pi agent 源码完全讲透的书，并讲出可用于构建你自己的 agent 的思想，目前仍在更新中只有前三章，作者 Yuu 预计每周更新一章（AI+人工创作）。书站为 JS 渲染的预览页，微博正文被反爬拦截，说明基于邮件正文。（微博链接失效/无法访问：微博反爬拦截）","_fileDate":"2026-08-15","category":["misc"]},{"date":"2026-08-09","title":"puppeteer - npm（Chrome/Firefox 自动化库）","src":"wangziqi9924@gmail.com","link":"https://www.npmjs.com/package/puppeteer","desc":"Puppeteer 是 JavaScript 库，提供高级 API 通过 Chrome DevTools Protocol 和 WebDriver BiDi 控制 Chrome 或 Firefox，默认以无头模式运行。可用于自动化浏览器里的任何操作：截图、生成 PDF、导航和测试复杂 UI、分析性能等，npm 当前版本 25.5.0（Apache-2.0 许可），周下载量超 1100 万，是爬虫和端到端测试的事实标准工具之一。","_fileDate":"2026-08-15","category":["misc"]},{"date":"2026-08-09","title":"oh-my-codex (OMX)：为 Codex 提供的多智能体编排层（无链接邮件）","src":"wangziqi9924@gmail.com","link":"","desc":"大王转发的笔记全文（无链接）：介绍开源项目 oh-my-codex (OMX)，一个为 Codex 提供的多智能体编排层，通过引入规划师、程序员、测试员和审查员等多个 AI 角色分工协作，解决 AI 编程中上下文占用高、易出错和 Token 消耗快的问题。核心功能包括多智能体协作拆分复杂任务、通过 Sub-agent 分工解决长上下文导致的遗忘出错、在代码生成流程中内置测试与审查环节；使用体验上只需一句话即可启动复杂任务，但上手有一定门槛，且对 Codex 以外编程工具的支持还不够完善。","_fileDate":"2026-08-15","category":["misc"]},{"date":"2026-08-09","title":"Tungsten Edge 钨极：原生轻量 macOS Dock 栏工具（小红书）","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/6VsT65guADX","desc":"小红书笔记（作者：设计师｜苗宏伟）介绍其开源的 macOS 原生 Dock 栏工具 Tungsten Edge 钨极：定位是「Windows 任务栏的效率 + macOS Dock 的简洁」但不臃肿，核心解决单一图标对应多窗口时无法一眼看到并快速切换的痛点，还带有抽屉区收纳不常用应用、内置启动台功能。主打原生与轻量化，实测内存占用约 38MB，比系统 Dock 的 55MB 还低，源码已在 GitHub 公开。","_fileDate":"2026-08-15","category":["misc"]},{"date":"2026-08-09","title":"TradingAgents：多智能体 LLM 金融交易框架（GitHub）","src":"wangziqi9924@gmail.com","link":"https://github.com/TauricResearch/TradingAgents","desc":"TauricResearch 开源的 TradingAgents 是一个多智能体交易框架，模拟真实交易公司的运作方式：部署基本面分析师、情绪专家、技术分析师、交易员和风险管理团队等多个 LLM 驱动的专业智能体，共同评估市场状况并做出交易决策，智能体之间还会动态讨论以确定最优策略。项目定位为研究用途，注明不构成金融投资建议，仓库主题为 agent/finance/llm/multiagent/trading。","_fileDate":"2026-08-15","category":["misc"]},{"date":"2026-08-09","title":"Runway 上线 Seedance 2.5（X @runwayml）","src":"wangziqi9924@gmail.com","link":"https://x.com/i/status/2085684483366523193","desc":"Runway 官方 X 账号宣布 Seedance 2.5 现已登陆 Runway 平台：单次生成最多可引用 50 个角色参考图来构建完整世界，可生成最长 30 秒带完整音效和对话的视频片段，并支持继续编辑和扩展，让故事创作更加自由。","_fileDate":"2026-08-15","category":["misc"]},{"date":"2026-08-09","title":"Prompt Bridge：让 AI 对话上下文跨平台随身携带（Product Hunt）","src":"wangziqi9924@gmail.com","link":"https://www.producthunt.com/products/prompt-bridge-2","desc":"本周在 Product Hunt 上线的免费 Chrome 扩展，口号是 Keep AI Context Portable：可以从 ChatGPT、Claude、Gemini、Grok、DeepSeek 抓取完整对话线程，压缩成紧凑的上下文包（实测 12,400 token 压到 890），再直接桥接粘贴到另一个 AI 的输入框，切换标签页自动识别目标平台，从此不用每次换 AI 都重新解释背景。隐私设计强调数据永不离开本机：线程存在浏览器 IndexedDB，密钥 AES-256-GCM 本地加密，作者声明零服务器、无遥测无账号，摘要功能使用用户自己的 API Key 直连各家模型。","_fileDate":"2026-08-15","category":["misc"]},{"date":"2026-08-09","title":"Prime Agent：会自我进化的 AI Agent 框架（小红书）","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/6ozgfcE25zR","desc":"小红书笔记（作者：JackRepo）记录 X @xiaohu（8月6日）分享的进展：Prime Agent 是一个能自主改进的递归 Agent 框架，只需把外层执行框架（Harness）换成它，Opus 5 在 ARC-AGI-3 基准的得分就从 30.2% 冲到 95.5%，超过人类专家基线的 95.4%，作者称可直接当 Claude Code、Codex 的替代品。它证明了模型能力上限很大程度上取决于外层执行框架，而框架本身也能让 AI 自己迭代。","_fileDate":"2026-08-15","category":["misc"]},{"date":"2026-08-09","title":"Kitesurf：运行在 Cloudflare Workers V8 isolate 上的 Agent 优先浏览器","src":"wangziqi9924@gmail.com","link":"https://blog.cloudflare.com/kitesurf/","desc":"Cloudflare 官方博客发布的 Kitesurf：一个为 AI Agent 设计的全新云端浏览器，完全跑在 Workers 之上，无状态、可大规模扩展、成本低廉，专为 Agentic Cloud 打造。它的理念是给 AI 模型提供真正契合其需求的工具——关注上下文窗口、Token 成本、并发和提示注入防护，而不是界面皮肤。","_fileDate":"2026-08-15","category":["misc"]},{"date":"2026-08-09","title":"Kitesurf：AI 终于有了自己的浏览器（小红书）","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/3BLMUq9kTXe","desc":"小红书笔记（作者：人工智能通讯社）解读 Cloudflare 新品 Kitesurf：一款面向 AI 智能体的云端浏览器，能让模型自己浏览网页、填写表单并完成在线任务。当「用户」从人变成 AI，设计重点也随之改变——上下文窗口、Token 成本、并发能力和提示注入风险比界面皮肤更重要。Kitesurf 已开放免费测试，官方称通过超 21.5 万项 Web 平台测试。","_fileDate":"2026-08-15","category":["misc"]},{"date":"2026-08-08","title":"设计网站合集：30+ 设计工具/网站导航（3 图）","src":"wangziqi9924@gmail.com","link":"","desc":"**企业级 Design System**：Twilio Paste、Workday Canvas、Adobe Spectrum、GitLab Pajamas、U.S. Web Design System、GOV.UK Design System、SAP Fiori、VMware Clarity、Oracle Redwood","_fileDate":"2026-08-15","category":["tools","create"]},{"date":"2026-08-08","title":"安卓电脑DeX桌面：不用刷机不限品牌也能体验（B站）","src":"wangziqi9924@gmail.com","link":"https://b23.tv/HxjbKFj","desc":"B 站 up 主「熊小白玩数码」的视频，演示不用刷机、不限品牌也能体验三星 DeX 桌面——把安卓手机/设备变成类似电脑的桌面模式。视频播放量 4.8 万+、点赞 1459、收藏 2880，属于安卓设备 PC 化/桌面化折腾类内容，适合想给安卓手机体验桌面系统的用户。","_fileDate":"2026-08-15","category":["misc"]},{"date":"2026-08-08","title":"如何0经验进入自己想了解的行业（小红书）","src":"wangziqi9924@gmail.com","link":"https://xhslink.cn/o/7CxI1KQhWyE","desc":"小红书博主「Wild能行の学习笔记」分享的 0 经验转行/入行方法论。作者自称\"三无人员\"（无漂亮履历、无实习经历、无人脉），却拿到了多个行业的\"水下工作机会\"（未公开招募的机会）。破局方式：找到自己的优势点，用技能靠近目标行业——作为志愿者参加行业活动结识从业者，主动向有相关经历的老师请教\"来时路\"并获得学习资源和实习机会，从产品经理实习起步一步步学用 AI。核心观点是不要害怕机会小，主动向外界表达自己想学什么，相信\"相信的力量\"。","_fileDate":"2026-08-15","category":["tips"]},{"da a collection of design-engineering skills to help humans and agents create better interfaces\"）","_fileDate":"2026-08-15","category":["skill","tips"]},{"date":"2026-08-06","title":"Swiftlet：Mac 上仅 4.3GB 内存跑 Qwen 80B","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/2H4g0sTodWU","desc":"小红书笔记（作者 北三陆的猫）：Hacker News 爆火的开源项目 Swiftlet，基于 Swift + Metal 的底层运行时，专为 Qwen3-Next 和 Qwen3.5/3.6 的 MoE 架构设计。核心机制是只把较小的 Dense 层常驻内存，巨大的 MoE 专家权重按路由需求从 SSD 流式加载：实测 Mac 仅用 4.3GB 内存跑 80B 模型，iPhone 17 上用 2.5GB 可用内存跑 35B 模型约 1 tok/s。该方案有争议——依赖 SSD 疯狂读取会遇 Prefill 性能瓶颈，且高频随机读取损伤硬盘寿命；另一派认为这是端侧 AI 走向普及的必经之路。","_fileDate":"2026-08-15","category":["tools"]},{"date":"2026-08-06","title":"OpenPhone：港大开源、让 AI 像人一样操作手机","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/AeexrLkWeTM","desc":"小红书笔记（作者 晓来在进化）：港大开源 OpenPhone，面向手机 AI 助手（Mobile Agent）的项目。核心是仅 30 亿参数的视觉语言模型 OpenPhone-3B，专门针对手机操作优化，能识别界面、理解任务、规划操作并在失败后自动修正；配有两套记忆系统（用户使用习惯 + 操作经验），采用端云协同思路（普通任务本地模型完成、复杂任务调云端大模型），并把训练流程、推理代码、评测工具全部开源（GitHub: HKUDS/OpenPhone）。大王补充：智谱去年开源的 9B OpenAutoGLM 和 AutoGLM App 都不好用，不如字节开源的 Midscene（视觉模型驱动的自动化测试框架）。","_fileDate":"2026-08-15","category":["tools"]},{"date":"2026-08-06","title":"OpenMinis：手机上带沙箱的端侧 AI Agent（微博 @Simon的白日梦）","src":"wangziqi9924@gmail.com","link":"https://weibo.com/1561900137/5330071850062876（08-11 合并 @摇摆时间线ZHLMI 使用体验微博）","desc":"补充（08-11 合并 @摇摆时间线ZHLMI 的使用体验微博）：作者用 Minis 频率已不亚于电脑端 Agent——轻量 Skill、故事创作、日常问答、脑暴都在 Minis 上完成，需要多端配合或复杂环境的才上电脑（OpenClaw + OpenCode 为主）；iOS 端 Node 生态需按「纯 JS > 有 musl prebuilt 且 iSH 不 crash > 其他」的优先级挑选依赖，编译链（better-sqlite3/canvas）和 iSH 不友好的 native（sharp）直接放弃，系统工具用 apk add 装；需浏览器扩展的 OpenCLI 之类无能为力，网页抓取建议走 MCP（豆包搜索、Firecrawl）；Android 端底层更开放、可玩性更高。（微博反爬拦截，说明基于邮件正文）","_fileDate":"2026-08-15","category":["tools","skill"]},{"date":"2026-08-06","title":"OpenAI 开源 Codex Security：Vibe Coding 安全插件（微信文章）","src":"wangziqi9924@gmail.com","link":"https://mp.weixin.qq.com/s/koVsKEyae9grJqrGtsln9g","desc":"微信公众号「数字生命卡兹克」文章：OpenAI 开源 Codex Security（前身是 2025 年 10 月的 Aardvark，GPT-5 驱动的 Agentic Security Researcher），原本封闭在 Codex 生态内，现在外部 Agent 也能调用——Claude Code、Kimi Code、CodeBuddy、Trae、Qoder 等都能装上它扫描产品漏洞；最新已支持 OpenRouter 和 Fireworks，底层漏洞分析模型可换成自己偏好的选择（GitHub: openai/codex-security）。文章起因是作者自己 Vibe Coding 的产品 AIHOT 被持续攻击，意识到安全是 Vibe Coding 被忽略的一环。","_fileDate":"2026-08-15","category":["tools"]},{"date":"2026-08-05","title":"苹果礼品卡购买经验","src":"wangziqi9924@gmail.com","link":"","desc":"大王分享的苹果礼品卡购买经验：美区、日区礼品卡直接在苹果官网购买，无需注册登录即可直购；土耳其区（土区）则在 seagm 平台购买，用支付宝付款目前没遇到什么问题。","_fileDate":"2026-08-15","category":["tips","deals"]},{"date":"2026-08-05","title":"微博 @flypig：字体缺失方块叫「tofu」，Noto 即 No tofu","src":"wangziqi9924@gmail.com","link":"https://weibo.com/1639529981/5328352799103149","desc":"微博 @flypig 的冷知识：缺少字体时显示的方块字符 口口口口口口 在英文里叫「tofu」（看起来像豆腐），而 Google 覆盖广泛的 Noto 字体命名含义正是「No tofu」（不再出现豆腐块）。（链接失效/无法访问：微博反爬拦截，说明基于邮件正文）","_fileDate":"2026-08-15","category":["insight"]},{"date":"2026-08-05","title":"WebRover：可能改变网页自动化的开源 AI Agent","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/A0qCtK1ghjd","desc":"小红书笔记（作者 李清）：WebRover 是 MIT 协议开源的自主式 Web 自动化 AI Agent，给它一句话就能自己打开浏览器、识别网页元素、点击输入、翻页跳转、跨网页收集信息并输出结构化结果（表格/JSON/摘要报告）。与传统爬虫不同，它不需要写死 Puppeteer/Playwright/Selenium 脚本，直接用自然语言描述任务即可，可做跨网站价格对比、竞品调研、招聘岗位收集、批量数据采集等。","_fileDate":"2026-08-15","category":["tools"]},{"date":"2026-08-05","title":"VisionPower：为 DeepSeek 量身定制的识图 MCP","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/1ZaVJCqVOQV","desc":"小红书笔记（作者 Run）：DeepSeek V4 Flash 虽能力大幅提升但本质仍是非多模态模型，配置到 Agent 后无法识图看图。VisionPower（GitHub 项目 RunhuaHuang/VisionPower）应运而生，npm 下载量超 3000，可装到任意 Agent 给非多模态大模型\"插上眼睛\"，尤其适配 Claude Code、Codex 等；本次升级支持在 WebUI 直接配置识图模型并内置大量模型预设，点赞关注私信可领 API Key 享受至少半年无限次免费识图（限量 100 人）。","_fileDate":"2026-08-15","category":["tools"]},{"date":"2026-08-05","title":"MiniMax Code 2.0：基于 Pi 构建的图形化 Coding Agent","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/184xDLnkioi","desc":"小红书笔记（作者 AI老黄）：Pi Agent 是继 Claude Code、OpenCode 之后最受关注的 Agent Harness 之一，核心简洁、运行稳定、扩展空间大。Min <script id="data" type="application/json">[{"date":"2026-08-13","title":"sv-number：给 Agent 一个能接验证码的真手机号 MCP 服务器（公众号 openvoid）","src":"公众号 openvoid","link":"https://mp.weixin.qq.com/s/XmOMpUsmqIGond4tqiCP0Q","desc":"公众号 openvoid（OpenMCP）2026-08-11 发布，介绍 openvoid 推荐的 sv-number/mcp-server（GitHub 约 490 星）：一个 MCP 服务器，给 Agent 配一个能接验证码的真手机号，接上后有 9 个电话工具（查余额/搜国家/找服务/下单号码/等验证码/完成激活），全程走 stdio API、无 SDK，npx -y sv-number-mcp 一条命令挂上。解决 Agent 自动化流程里「注册要手机号收验证码」的断裂点：list_services 直接按名字搜（不用记 Discord 是 ds 还是 dc，URL/名字都能搜，按匹配度排序）；wait_for_code 每 4 秒自动轮询、最长等 20 分钟、从短信正文自动提取数字验证码；order_number 支持 service+country 一键切换，130+ 国家覆盖；另有 TOTP 本地计算验证码、退款保护（cancel/finish_activation）和 get_balance 余额管理。注意事项：付费服务（需去 sms-verification-number.com 注册充值，无免费额度）、只收不发（不能发短信接电话）、API Key 仅在进程内使用不外泄。同类做成 MCP 服务器的目前仅此一家（其他如 platfone-com/mcp、agentsimdev/agentsim-mcp 都只是个位数 star）。相关资源：GitHub sv-number/mcp-server、官方文档 sms-verification-number.com/en/number-for-ai-agents、Skill 版 sv-number/skills、API 参考 sms-verification-number.com/en/api-sms-activate。（手机端添加）","_fileDate":"2026-08-13","category":["tools"]},{"date":"2026-08-13","title":"codex-host：让 Pi 模型在 Codex Desktop GUI 上运行的插件（GitHub @BytePioneer-AI）","src":"微信","link":"https://github.com/BytePioneer-AI/codex-host","desc":"用户实测 codex-host 插件在 Pi 环境里配合 v4Pro 很丝滑（测过几个 case）：一个能让 Pi 模型运行在 Codex GUI 之上的插件，可以同时享受 Pi 的能力和 Codex Desktop 的 UI。（手机端添加）","_fileDate":"2026-08-13","category":["tools"]},{"date":"2026-08-13","title":"字节跳动公开 Seedance 2.5 / Seedream 5.0 Pro 导演级分镜文档（微博 @爱可可-爱生活）","src":"微博@爱可可-爱生活","link":"https://weibo.com/1402400261/5331175184533709","desc":"微博 @爱可可-爱生活 分享字节跳动近期公开的 Seedance 2.5 与 Seedream 5.0 Pro 官方提示词文档（bytedance.larkoffice.com/docx/EvLJdw9n8oX1HExDfllcA22jnLe）：把 30 秒长镜头、时间戳精准控制、多素材参考等进阶玩法悉数共享，包含从盛唐夜景到废土科幻的数十套完整案例——精细化到秒级的 Prompt、镜头调度、负面词规避、音效配合都写成可直接复制的分镜剧本。作者点评：这种资源释放宣告靠卖基础 Prompt 赚差价的 AI 收费课失去生存空间；字节此举是通过降低审美与专业门槛，把 AI 视频从随机抽卡推向确定性生产。视频生成瓶颈已不再是工具本身，而是如何像导演一样思考转场与叙事；这套融合摄影美学与工程指令的方法论是当下最有价值的商业资产。（手机端添加）","_fileDate":"2026-08-13","category":["tutorial"]},{"date":"2026-08-13","title":"Skill Recorder：微软开源、把操作录制成 Agent Skill（微博 @摇摆时间线ZHLMI）","src":"微博@摇摆时间线ZHLMI","link":"https://weibo.com/1561900137/5331057629203904（微博分享页）","desc":"微博 @摇摆时间线ZHLMI 介绍微软开源的 Skill Recorder：跟 OpenAI Codex 的 Record & Replay、Anthropic Claude Cowork 的 Record a skill 干的是同一件事——录制一次自己完成任务的过程，把它转化为 AI Agent 可重复使用的 Skill。理念是「很多事你自己已做了千百遍、清楚最短路径，没必要让 Agent 重新摸索」，把自己的操作录下来让 Agent 原样复刻即可。关键点：它不是按键精灵（不能乱动桌面、不能乱动窗口大小），而是记录你『想干什么』、先理解意图再把操作翻译成 Agent 的原生工具调用（而非重放 UI 点击），因此具备泛化能力。适合给没有 Record 能力（Codex/Cowork 用不上）的 Agent 工作流补上「教 Agent 走一遍」的能力。（手机端添加）","_fileDate":"2026-08-13","category":["tools"]},{"date":"2026-08-13","title":"ai-website-cloner-template：Claude 直接复制任何网站界面（微博 @张岱樾）","src":"微博@张岱樾","link":"https://weibo.com/1890573293/5330788409148544（微博分享页）","desc":"微博 @张岱樾 分享的开源项目 ai-website-cloner-template（repo: JCodesMore/ai-website-cloner-template，GitHub 18k 星、完全免费开源）：把目标网址丢进 Claude Code，它就能反向工程整个网站设计——颜色、字体、布局全部复制，拿来即用。支持 Cursor、Copilot、Gemini 以及 10+ 个 AI Agent 工具，是把任意站点界面化成可复用模板的利器。（手机端添加）","_fileDate":"2026-08-13","category":["tools"]},{"date":"2026-08-13","title":"微博 @张岱樾：直接从顶级公司免费学习 AI（10 个官方免费平台）","src":"微博@张岱樾","link":"https://weibo.com/1890573293/5330697557641744（微博分享页）","desc":"微博 @张岱樾 整理的 10 个在顶级 AI/科技公司官网直接免费学 AI 的资源：Anthropic（anthropic.skilljar.com，Claude 官方学习）、Google（grow.google/ai）、Meta（ai.meta.com/resources/，Llama 资源）、NVIDIA（developer.nvidia.com/cuda，CUDA 开发）、Microsoft（learn.microsoft.com/en-us/training/）、OpenAI（academy.openai.com）、IBM（skillsbuild.org）、AWS（skillbuilder.aws）、DeepLearning AI（deeplearning.ai，吴恩达）、Hugging Face（huggingface.co/learn，开源模型学习）。多为英文内容，部分平台需要合理的网络环境才能顺畅访问。（手机端添加）","_fileDate":"2026-08-13","category":["tutorial"]},{"date":"2026-08-13","title":"GoodCase.ai：封装3年实测经验的AI提示词案例网站（公众号 卡尔&阿汤）","src":"微信直发","link":"https://mp.weixin.qq.com/s/DrTsNHckOqtoMHJqQyY5Bg","desc":"公众号「卡尔&阿汤」宣布开源 AI 提示语案例网站 GoodCase.ai：作者三年攒的上千条 AI 视频/AI 前端/Agent 生成记录（每条带完整提示语+模型版本+生成效果）整理成经过验证的案例库，第一版用十万积分横测 Seedance 2.0 Fast、MiniMax H3、Wan 3.0 三个 720P 价格接近的模型（136 个 case），覆盖多素材参考生视频（含 Kpop MV 超长提示语）等三类高区分度输入。验证方法论很朴素：先踢掉没提示语的案例，再用同一批提示语跨模型交叉验证，最后把真正跨模型跑通的案例抽象成可复用的 Skill——「选模型没有标准答案，只有适合自己场景的最优解」。（微信文章抓取成功）","_fileDate":"2026-08-13","category":["tools"]},{"date":"2026-08-13","title":"Kronos：首个开源金融 K 线基础模型（GitHub @shiyu-coder）","src":"微信直发","link":"https://github.com/shiyu-coder/Kronos","desc":"开源金融 K 线（candlestick）基础模型 Kronos（GitHub 约 3.7 万 star）：首个开源的金融 K 线语言基础模型，训练数据覆盖 45+ 全球交易所，论文被 AAAI 2026 接收并已上 arXiv，附带开源微调脚本可适配自己的交易任务——用 K 线图做金融时序预测与量化研究。","_fileDate":"2026-08-13","category":["tools"]},{"date":"2026-08-13","title":"MediaCrawler：多平台自媒体爬虫（小红书/抖音/快手/B站/微博/贴吧/知乎）","src":"微信直发","link":"https://github.com/NanmiCoder/MediaCrawler","desc":"MediaCrawler（GitHub 约 6.2 万 star）是一个多平台自媒体数据采集工具：支持小红书笔记/评论、抖音视频/评论、快手、B 站、微博、百度贴吧、知乎问答等主流平台的公开信息抓取，基于 Playwright 浏览器自动化登录保存登录态，爬取笔记、评论、视频、帖子等数据，仅限学习研究用途。","_fileDate":"2026-08-13","category":["tools"]},{"date":"2026-08-13","title":"mattpocock/skills：Matt Pocock 的工程师实战 Skills 仓库（GitHub）","src":"微信直发","link":"https://github.com/mattpocock/skills","desc":"Matt Pocock（TypeScript 社区知名作者）的 Agent Skills 仓库（GitHub 约 21.5 万 star），收录他自己 .agents 目录里用于真实工程实践的 skills——从个人工作流里直接提炼，不是教学演示，覆盖实际编码工程场景，可直接装进 Claude Code / Codex 等 Agent 使用。","_fileDate":"2026-08-13","category":["skill"]},{"date":"2026-08-13","title":"needle：14MB 微型基础模型，跑在手机/穿戴/智能家居/机器人上（GitHub @cactus-compute）","src":"微信直发","link":"https://github.com/cactus-compute/needle","desc":"cactus-compute 开源的 needle（GitHub 约 4.3 千 star）：一个仅 14MB 的基础模型，专为微型设备设计——手机、可穿戴设备、智能家居和机器人，把 LLM 能力塞进资源受限的端侧硬件，主打小体积低功耗的本地推理。","_fileDate":"2026-08-13","category":["tools"]},{"date":"2026-08-12","title":"linux.do 话题 2629870","src":"微信直发","link":"https://linux.do/t/topic/2629870/8","desc":"LINUX DO 论坛帖子链接（第 8 楼回复），Cloudflare 防护 + 登录墙导致无法抓取内容（无法访问）。","_fileDate":"2026-08-13","category":["misc"]},{"date":"2026-08-12","title":"nie-grassroots-logic：把《基层中国的运行逻辑》做成可执行 AI Skill（微博 @蚁工厂）","src":"wangziqi9924@gmail.com","link":"https://weibo.com/2194035935/5330733469273885（微博分享页）","desc":"微博 @蚁工厂 分享的开源项目 ayi-ai/nie-grassroots-logic（MIT 协议、14 个模块）：把聂辉华《基层中国的运行逻辑》一书提炼成可执行 AI Skill，把县乡村治理框架（条块、含权量、双均衡、三座大山…）整理成可被 Cursor / Claude Code / Codex / Grok 反复调用的方法论工具箱——用来解释地方新闻与权力结构，也用来辅助求学、考公、投资、养老、创业等个人选择。仓库不含原书全文，设计原则是提纯结构不写摘要、保留作者精确命名、按需懒加载。（微博链接被反爬拦截，GitHub 仓库抓取成功）","_fileDate":"2026-08-13","category":["skill"]},{"date":"2026-08-12","title":"微博 @AIGC·非著名程序员：「Token 不限量」实验的七条观察","src":"wangziqi9924@gmail.com","link":"https://weibo.com/5078115336/5330707804850190","desc":"微博 @AIGC·非著名程序员 分享一个二十多人 AI 团队拿约百万美元预算做「Token 不限量」实验后的七条观察：Token 管够后效率瓶颈撞在人身上（成员单日最高烧约 7000 美元、产出却没跟着翻倍）；AI 上限取决于传统组织能否完成从 0 到 1 的 AI 化；员工反而更累（中位数同时开约 5 个 session、工资不变活变多）；贵模型不是万能、按任务难度做模型路由更划算；会议少近八成但「AI 跟 AI 对话」让团队共同理解变浅；沟通转向异步离线、信息失真累积。结论是这更像一场穿着技术实验外衣的管理问题——别数烧了多少 Token，要量 AI 有没有减轻人的认知负荷、同时增强团队的共同理解。（链接失效/无法访问：微博反爬拦截，说明基于邮件正文）","_fileDate":"2026-08-13","category":["insight"]},{"date":"2026-08-12","title":"经过第一轮招聘 对学历祛魅了：AI 团队招人只看 demo（小红书）","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/1lsRW6Ea8HF","desc":"小红书笔记（AI 初创团队招聘分享）：耗时 4 天、招人模式迭代 3 次，从最开始看简历进化到 V3.0 只看 demo——应聘者以视频/网址/压缩包形式投递作品，看中直接进终面、省掉冗长沟通；没看到能力展示之前不想回答问题，认为同样时间拿去 BD 比招聘性价比更高。团队要的是复合型人才（\"不想当设计的前端不是好产品\"）、不要螺丝钉，正在招募核心成员，称薪资不是问题。","_fileDate":"2026-08-13","category":["career"]},{"date":"2026-08-12","title":"Cloudflare Mesh：赛博菩萨版 Tailscale，免费 50 节点（小红书）","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/3fk4M9yKxtK","desc":"小红书笔记介绍 Cloudflare Mesh（博主称之为「Cloudflare 版 Tailscale」）：一个能把全球各地的手机、电脑、服务器甚至 AI 机器人全部拉进同一个「加密局域网」的组网工具，类似 Tailscale 的异地设备互联能力。免费额度很香——每个账号直接送 50 个节点 + 50 个用户，中小团队或个人白嫖完全够用；体验路径是 Cloudflare 后台点击 Network → Mesh 开启。","_fileDate":"2026-08-13","category":["tools"]},{"date":"2026-08-12","title":"微博 @tombkeeper：勇敢接受工作挑战，让人快速成长","src":"wangziqi9924@gmail.com","link":"https://weibo.com/1401527553/4385033605017185","desc":"微博 @tombkeeper 分享刚参加工作时的心得：部门接到各类任务，领导问能不能干，他一般都说「让我去试试吧」，然后抓紧时间查资料学习相关内容。核心观点：勇敢接受工作挑战可以让人快速成长，也会带来更多机会，这是马太效应——当时领导给他的评语是「不管什么工作，交给你我就放心了，反正你总有办法搞定」；当然也要了解清楚需求，特别是对时间的要求，评估好是否在自己跳一跳能够得着的范围内。（链接失效/无法访问：微博反爬拦截，说明基于邮件正文）","_fileDate":"2026-08-13","category":["career"]},{"date":"2026-08-12","title":"『所有的无用，都是有用的』（微信公众号文章）","src":"wangziqi9924@gmail.com","link":"https://mp.weixin.qq.com/s?__biz=MzI0NDA5MDYyNA==&mid=2648257269&idx=1&sn=e0d43ff220c616ab1c5899bd06d97f59","desc":"微博分享的微信公众号文章，标题为「所有的无用，都是有用的」。正文被微信验证页拦截（环境异常/verify 页），无法抓取更多内容。（链接失效/无法访问：微信验证页拦截，无更多信息）","_fileDate":"2026-08-13","category":["insight"]},{"date":"2026-08-11","title":"tracecite-mobile：AI 自动分析手机运行日志（小红书 @大熊猫）","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/3iGueIztNnS","desc":"小红书笔记（作者：大熊猫）介绍移动端开发日志分析工具 tracecite-mobile：解决「Bug 复现→连手机→导出海量日志→手动搜关键字找根因」的痛点，iPhone/Android 插上后通过 adb / idevicesyslog 直连真机自动采集运行日志，Agent 接手分析——自动定位事发时间窗、搜关键字、归类过滤，最后把结论整理好给开发者。","_fileDate":"2026-08-13","category":["misc"]},{"date":"2026-08-11","title":"AirTap：住在 iMessage 里的 AI 手机助手（公众号 龙说效率）","src":"wangziqi9924@gmail.com","link":"https://mp.weixin.qq.com/s/kRm-WxNnchU01ts4_zNPAw","desc":"公众号「龙说效率」介绍 AirTap（官网 airtap.ai，口号 Text your apps）：住在 iMessage 短信里的 AI 代理，发条消息就替你点屏幕、打字、滑动，不调任何 App API，而是用计算机视觉「看着屏幕」像真人一样操作，任何有图形界面的 App 都能用。三层架构：大脑（Airtap AI Cloud，不锁死模型，可通过 SKILLS.md 接 Claude/Codex/OpenClaw）、双手（AutoPilot 视觉操控）、设备（美国云手机 24 小时在线或本地物理机）；不用装 App、不用科学上网，隐私上不存密码、密码框加密屏蔽、云手机隔离、退出即擦除。可接进 OpenClaw（openclaw skills install @skills-airtap/airtap），让 AI 从「只能想」变成「能帮我做」。","_fileDate":"2026-08-13","category":["skill"]},{"date":"2026-08-11","title":"i-have-adhd：1.8 万星的 AI 回答规范 Skill（公众号 逛逛GitHub）","src":"wangziqi9924@gmail.com","link":"https://mp.weixin.qq.com/s/_Peb1KkjGP-KZchE5vYVgw","desc":"公众号「逛逛GitHub」介绍 GitHub 1.8 万+ star 的开源项目 i-have-adhd（repo: ayghri/i-have-adhd）：核心是一份约束 AI 回答顺序的 SKILL.md，不训练模型、不改编程能力，只调整信息出现的顺序和拆解粒度。10 条规则核心三件事——答案放前面、步骤编号、随时说明进度，删掉客套话和多余展开；保留安全规则（危险操作先确认、连续失败三次停止重试）。支持 Claude Code、Codex、Qwen Code、Gemini CLI、Antigravity，可临时调用也可设为每次会话自动加载（如 touch ~/.claude/.i-have-adhd-always）。","_fileDate":"2026-08-13","category":["skill"]},{"date": 无链接）","_fileDate":"2026-08-13","category":["misc"]},{"date":"2026-08-10","title":"用 LLM 学习复杂主题：把知识库变成游戏化模拟（微博 @蚁工厂）","src":"wangziqi9924@gmail.com","link":"https://weibo.com/2194035935/5330284199546547（微博分享页）","desc":"微博 @蚁工厂 推荐工程师 Laurențiu Răducu 的博文《How I use LLMs to learn complex topics》：作者觉得 LLM 解释太浅显难记，改用「先建知识库、再改造成游戏化可视化项目」的学习法。流程：计划模式下让模型为主题建立基础知识库 → 让它复核准确性 → 用 low-poly 过山车大亨风格动画做该主题的模拟（要求响应式、可暂停控制）→ 推到 GitHub Pages。实例 ChipTycoon 带玩家从采砂到芯片交付数据中心全程走一遍，作者还做了火箭发动机、LLM 原理（token-town）、F1 发动机、EUV 光刻机等系列模拟站，并把图片转 3D 的 Skill（unreal-game-assets-creation-skill）与生成学习动画的 learnscape SKILL.md 一并开源。（微博链接被反爬拦截，博客抓取成功）","_fileDate":"2026-08-13","category":["skill"]},{"date":"2026-08-10","title":"Zhihu CLI：知乎官方 Agent 命令行工具（微博 @蚁工厂）","src":"wangziqi9924@gmail.com","link":"https://zhuanlan.zhihu.com/p/2068355085243871946（官方介绍文）","desc":"微博 @蚁工厂 分享知乎数据开放平台面向 AI Agent 推出的官方命令行工具 Zhihu CLI：把配套 Skill 交给 Agent，就能搜索知乎和全网内容、查看知乎热榜、调用知乎直答，目前免费调用额度 5000 次/天。邮件内短链 http://t.cn/AXNVRm0w 已失效（403），经搜索确认官方介绍与功能。（链接失效/无法访问：原短链失效，说明基于邮件正文与搜索到的官方信息）","_fileDate":"2026-08-13","category":["skill"]},{"date":"2026-08-10","title":"CodeGraph：预索引代码知识图谱，帮 Agent 省 token（微博 @我是一只小小小鸡仔）","src":"wangziqi9924@gmail.com","link":"https://github.com/colbymchenry/codegraph","desc":"微博 @我是一只小小小鸡仔 分享开源工具 CodeGraph（repo: colbymchenry/codegraph，约 6.6 万 star）：把代码库从「文件集合」转换成「可查询的关系图」，帮助 AI 更快理解大型项目，从而节省 Code Agent 的 token 和工具调用次数。预索引（pre-indexed）、代码变更自动同步，100% 本地运行，支持 Claude Code、Codex、Gemini、Cursor、OpenCode、AntiGravity、Kiro、Hermes Agent 等主流 harness。（原短链 t.cn/AXiNlkta 已解析到 GitHub 仓库，抓取成功）","_fileDate":"2026-08-13","category":["misc"]},{"date":"2026-08-10","title":"微博 @tombkeeper：汉族内部可分 7 个基因亚群","src":"wangziqi9924@gmail.com","link":"https://weibo.com/1401527553/5330481321348283","desc":"微博 @tombkeeper 分享基因视角的观点：从基因来看汉族内部可分北方、西北、东部、中部、南方、东南、岭南 7 个亚群，很多少数民族甚至其它国家和汉族的基因差异还不如汉族内部亚群之间的差异大，例如山东人和广东人的差异比山东人和韩国人的差异更大。（链接失效/无法访问：微博反爬拦截，说明基于邮件正文）","_fileDate":"2026-08-13","category":["insight"]},{"date":"2026-08-10","title":"乔 https://www.producthunt.com/products/workflo-2","desc":"Product Hunt 本周上线的 Mac 工作区自动化工具：自动在会议或专注时段前摆好需要的窗口（Scenes），显示器插拔时恢复布局（Desks），一键热键暂存/恢复屏幕（Stash）。设计上只用 Accessibility 权限、结构上无法读取屏幕内容（不申请录屏权限），原生 Swift 约 4MB、一次性买断 $19.99（首发 20% 折扣），纯本地运行、不收集不传输任何数据。","_fileDate":"2026-08-13","category":["misc"]},{"date":"2026-08-10","title":"VoiceOS：语音驱动电脑操作 + 语音原生 App 商店（Product Hunt）","src":"wangziqi9924@gmail.com","link":"https://www.producthunt.com/products/voiceos","desc":"YC 背景的 VoiceOS 是系统级\"语音到操作\"工具（Mac/Windows）：自然说话即可跨应用执行工作流，执行前带快速确认步骤，免去频繁切换 App。本次发布的是 VoiceOS App Store（当日 Product Hunt 排名第 2）：用一句话描述（如\"创建一个帮我写日记的 App\"）即可生成语音原生应用，分享链接让任何人一键安装，支持自动更新，也可让 Claude 或 Codex 继续编辑应用逻辑。","_fileDate":"2026-08-13","category":["misc"]},{"date":"2026-08-10","title":"NVIDIA NemotronLabs VoiceChat 11B：开源全双工语音对话模型（MarkTechPost）","src":"wangziqi9924@gmail.com","link":"https://www.marktechpost.com/2026/08/09/nvidia-releases-nemotronlabs-voicechat-11b-an-open-full-duplex-speech-to-speech-model-with-450-ms-turn-taking-and-live-tool-calling/","desc":"NVIDIA 开源的 11B 端到端语音到语音（speech-to-speech）模型：用单一统一网络替代 ASR+LLM+TTS 级联架构，实测平滑轮转延迟 448ms，支持边听边说、中途打断（480ms 打断接管率 1.00），是首个支持对话中工具调用的开源全双工模型——通过旁路 TOOLCALL 通道输出工具脚本，并用运营商定义的 on-hold 话术填补 API 等待时间。需 80GB 显存 GPU（A100/H100/RTX 6000 Pro 等），NVIDIA 标注为\"仅研究用途\"，暂无托管 API，在 Full-Duplex-Bench 1.0 上排名开源模型第 2。","_fileDate":"2026-08-13","category":["misc"]},{"date":"2026-08-10","title":"Karpo：盯上年轻人城市生活的主动式 AI（微信公众号 虾蛄内容部）","src":"wangziqi9924@gmail.com","link":"https://mp.weixin.qq.com/s/lNAi2buD4AAHCEokXaIVyw","desc":"公众号「虾蛄内容部」报道 MachinePulse 推出的主动式 AI 出行产品 Karpo：住在 iMessage 里的生活助理，像给朋友发短信一样提问即可获得建议，覆盖餐厅、演出、派对、展览、酒吧、周末安排和旅行计划等本地生活场景，支持通过 Klook、Viator 等完成预订，AI 还能代表用户给商家打电话询问位置、价格和排队情况。团队核心成员来自字节跳动（豆包）、Amazon、PayPal、阶跃星辰，已获 Creekstone Ventures、高瓴创投、蓝驰创投等数千万美元融资、估值近 1 亿美元；同时开源了让 Agent 感知新闻/天气/市场/GitHub 等外部信号的 World2Agent 项目（GitHub 约 1200 star）。","_fileDate":"2026-08-13","category":["misc"]},{"date":"2026-08-09","title":"TradingAgents：多智能体 LLM 金融交易框架（GitHub）","src":"wangziqi9924@gmail.com","link":"https://github.com/TauricResearch/TradingAgents","desc":"TauricResearch 开源的 TradingAgents 是一个多智能体交易框架，模拟真实交易公司的运作方式：部署基本面分析师、情绪专家、技术分析师、交易员和风险管理团队等多个 LLM 驱动的专业智能体，共同评估市场状况并做出交易决策，智能体之间还会动态讨论以确定最优策略。项目定位为研究用途，注明不构成金融投资建议，仓库主题为 agent/finance/llm/multiagent/trading。","_fileDate":"2026-08-13","category":["misc"]},{"date":"2026-08-09","title":"Prompt Bridge：让 AI 对话上下文跨平台随身携带（Product Hunt）","src":"wangziqi9924@gmail.com","link":"https://www.producthunt.com/products/prompt-bridge-2","desc":"本周在 Product Hunt 上线的免费 Chrome 扩展，口号是 Keep AI Context Portable：可以从 ChatGPT、Claude、Gemini、Grok、DeepSeek 抓取完整对话线程，压缩成紧凑的上下文包（实测 12,400 token 压到 890），再直接桥接粘贴到另一个 AI 的输入框，切换标签页自动识别目标平台，从此不用每次换 AI 都重新解释背景。隐私设计强调数据永不离开本机：线程存在浏览器 IndexedDB，密钥 AES-256-GCM 本地加密，作者声明零服务器、无遥测无账号，摘要功能使用用户自己的 API Key 直连各家模型。","_fileDate":"2026-08-13","category":["misc"]},{"date":"2026-08-09","title":"puppeteer - npm（Chrome/Firefox 自动化库）","src":"wangziqi9924@gmail.com","link":"https://www.npmjs.com/package/puppeteer","desc":"Puppeteer 是 JavaScript 库，提供高级 API 通过 Chrome DevTools Protocol 和 WebDriver BiDi 控制 Chrome 或 Firefox，默认以无头模式运行。可用于自动化浏览器里的任何操作：截图、生成 PDF、导航和测试复杂 UI、分析性能等，npm 当前版本 25.5.0（Apache-2.0 许可），周下载量超 1100 万，是爬虫和端到端测试的事实标准工具之一。","_fileDate":"2026-08-13","category":["misc"]},{"date":"2026-08-09","title":"Runway 上线 Seedance 2.5（X @runwayml）","src":"wangziqi9924@gmail.com","link":"https://x.com/i/status/2085684483366523193","desc":"Runway 官方 X 账号宣布 Seedance 2.5 现已登陆 Runway 平台：单次生成最多可引用 50 个角色参考图来构建完整世界，可生成最长 30 秒带完整音效和对话的视频片段，并支持继续编辑和扩展，让故事创作更加自由。","_fileDate":"2026-08-13","category":["misc"]},{"date":"2026-08-09","title":"Kitesurf：运行在 Cloudflare Workers V8 isolate 上的 Agent 优先浏览器","src":"wangziqi9924@gmail.com","link":"https://blog.cloudflare.com/kitesurf/","desc":"Cloudflare 官方博客发布的 Kitesurf：一个为 AI Agent 设计的全新云端浏览器，完全跑在 Workers 之上，无状态、可大规模扩展、成本低廉，专为 Agentic Cloud 打造。它的理念是给 AI 模型提供真正契合其需求的工具——关注上下文窗口、Token 成本、并发和提示注入防护，而不是界面皮肤。","_fileDate":"2026-08-13","category":["misc"]},{"date":"2026-08-09","title":"Tungsten Edge 钨极：原生轻量 macOS Dock 栏工具（小红书）","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/6VsT65guADX","desc":"小红书笔记（作者：设计师｜苗宏伟）介绍其开源的 macOS 原生 Dock 栏工具 Tungsten Edge 钨极：定位是「Windows 任务栏的效率 + macOS Dock 的简洁」但不臃肿，核心解决单一图标对应多窗口时无法一眼看到并快速切换的痛点，还带有抽屉区收纳不常用应用、内置启动台功能。主打原生与轻量化，实测内存占用约 38MB，比系统 Dock 的 55MB 还低，源码已在 GitHub 公开。","_fileDate":"2026-08-13","category":["misc"]},{"date":"2026-08-09","title":"抖音视频：王波粒「我做的两个 App，两次改变了我的人生轨迹」","src":"wangziqi9924@gmail.com","link":"https://v.douyin.com/6bE4fByqB2Y/","desc":"抖音作者 @王波粒 的分享视频，讲述他做过的两个 App 如何两次改变他的人生轨迹（主题含「#锤…」字样）。页面为 JS 加密反爬，抓不到视频页正文，说明基于邮件正文。（链接失效/无法访问：抖音页面反爬，无更多信息）","_fileDate":"2026-08-13","category":["life"]},{"date":"2026-08-09","title":"oh-my-codex (OMX)：为 Codex 提供的多智能体编排层（无链接邮件）","src":"wangziqi9924@gmail.com","link":"","desc":"大王转发的笔记全文（无链接）：介绍开源项目 oh-my-codex (OMX)，一个为 Codex 提供的多智能体编排层，通过引入规划师、程序员、测试员和审查员等多个 AI 角色分工协作，解决 AI 编程中上下文占用高、易出错和 Token 消耗快的问题。核心功能包括多智能体协作拆分复杂任务、通过 Sub-agent 分工解决长上下文导致的遗忘出错、在代码生成流程中内置测试与审查环节；使用体验上只需一句话即可启动复杂任务，但上手有一定门槛，且对 Codex 以外编程工具的支持还不够完善。","_fileDate":"2026-08-13","category":["misc"]},{"date":"2026-08-09","title":"Prime Agent：会自我进化的 AI Agent 框架（小红书）","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/6ozgfcE25zR","desc":"小红书笔记（作者：JackRepo）记录 X @xiaohu（8月6日）分享的进展：Prime Agent 是一个能自主改进的递归 Agent 框架，只需把外层执行框架（Harness）换成它，Opus 5 在 ARC-AGI-3 基准的得分就从 30.2% 冲到 95.5%，超过人类专家基线的 95.4%，作者称可直接当 Claude Code、Codex 的替代品。它证明了模型能力上限很大程度上取决于外层执行框架，而框架本身也能让 AI 自己迭代。","_fileDate":"2026-08-13","category":["misc"]},{"date":"2026-08-09","title":"Kitesurf：AI 终于有了自己的浏览器（小红书）","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/3BLMUq9kTXe","desc":"小红书笔记（作者：人工智能通讯社）解读 Cloudflare 新品 Kitesurf：一款面向 AI 智能体的云端浏览器，能让模型自己浏览网页、填写表单并完成在线任务。当「用户」从人变成 AI，设计重点也随之改变——上下文窗口、Token 成本、并发能力和提示注入风险比界面皮肤更重要。Kitesurf 已开放免费测试，官方称通过超 21.5 万项 Web 平台测试。","_fileDate":"2026-08-13","category":["misc"]},{"date":"2026-08-09","title":"阿里高德 Agent 团队开源 LongHorizon-Harness（小红书）","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/Ab4uSf8WaWU","desc":"小红书笔记（作者：王鹏LLM）介绍高德 Agent 团队（AMAP-ML）开源的 LongHorizon-Harness：一套让 Agent 在真实电脑环境中像人一样操作整台计算机、跨桌面 App/浏览器/命令行持续工作数十小时并保持目标不漂移的执行系统，支持点击输入滚动、操作表格文档设计与 3D 软件、写代码跑命令装环境调系统，不绑定模型与 Agent 后端（可接 Claude、GPT、Qwen 及 Claude Code、Codex CLI、OpenClaw）。实测 GUI 与 CLI 混合任务完成率从约 50% 提升至约 80%，长时桌面任务完整完成率提升至 3 倍，代码与命令行任务成功率从 69.7% 提升至 77.2%，同时减少 24% 的 token 消耗，论文见 arxiv.org/abs/2608.01964。","_fileDate":"2026-08-13","category":["misc"]},{"date":"2026-08-09","title":"微博 @宝玉xp：怎么用好 Agent 的 /goal 功能","src":"wangziqi9924@gmail.com","link":"https://weibo.com/1727858283/5329579549656926","desc":"微博 @宝玉xp 分享 Agent 的 /goal 功能用法：给 Agent 一个目标让它长时间运行直到完成，关键是三点——明确目标、如何验证结果、停止条件。他以性能优化任务为例（Fable 5 帮他把视频转录性能优化了 2 倍多），提示词里先让 Agent 用测试视频建立基准，再分析瓶颈反复优化、对照基准看效果，结束条件设为「觉得没有优化空间」，而不是给出具体指标。微博页面被反爬拦截无法抓取正文，说明基于邮件正文。（链接失效/无法访问：微博反爬拦截）","_fileDate":"2026-08-13","category":["tips"]},{"date":"2026-08-09","title":"微博 @刘小波的博：人要有站街女精神","src":"wangziqi9924@gmail.com","link":"https://weibo.com/6167988003/5329707559294769","desc":"微博 @刘小波的博 的观点：人要有「站街女精神」——主动走到机会面前问「我可以吗」，接受拒绝和被挑选，然后赚钱；不要觉得被人挑选是耻辱，在好机会面前被挑选会越来越好。作者强调只是取其「主动争取、不怕被拒」的精神而非字面意思。微博页面被反爬拦截无法抓取正文，说明基于邮件正文。（链接失效/无法访问：微博反爬拦截）","_fileDate":"2026-08-13","category":["career"]},{"date":"2026-08-09","title":"π-agent book：讲透 Pi agent 源码的书（微博 @蚁工厂）","src":"wangziqi9924@gmail.com","link":"https://weibo.com/2194035935/5329630223667687","desc":"微博 @蚁工厂 推荐《π-agent book》（books.antinomie.org/pi/）：一本把 Pi agent 源码完全讲透的书，并讲出可用于构建你自己的 agent 的思想，目前仍在更新中只有前三章，作者 Yuu 预计每周更新一章（AI+人工创作）。书站为 JS 渲染的预览页，微博正文被反爬拦截，说明基于邮件正文。（微博链接失效/无法访问：微博反爬拦截）","_fileDate":"2026-08-13","category":["misc"]},{"date":"2026-08-09","title":"《深入理解 AI Agent》开源书：设计原理与工程实践（微博 @张岱樾）","src":"wangziqi9924@gmail.com","link":"https://weibo.com/1890573293/5329746541679580","desc":"微博 @张岱樾 推荐一本没什么技术背景也能看懂的《深入理解 AI Agent》（李博杰 著）。开源主仓库 bojieli/ai-agent-book 包含全书正文、编译版 PDF 与按章配套代码，适合想系统入门 AI Agent 原理与工程实践的读者。微博正文被反爬拦截，说明基于邮件正文。（微博链接失效/无法访问：微博反爬拦截）","_fileDate":"2026-08-13","category":["misc"]},{"date":"2026-08-09","title":"微博 @梁州Zz：日常找选题的流程分享","src":"wangziqi9924@gmail.com","link":"https://weibo.com/2661864314/5329751712471153","desc":"微博 @梁州Zz 分享其日常找选题的流程：先从日常熟悉但细想有疑惑的现象出发，追问它如何形成、背后是否有被忽略的历史/地理/权力线索；进入选题后二筛——看现象是否经历过明显历史转折、能否连接文学地理制度与普通人生活，只有能挖出足够多「地层」的题目才入选；再沿时间轴分别找史料、文学、地理、制度与人物作支撑，最后反复核对材料间的因果关系，解释「为什么偏偏在这个时代发生变化」。微博页面被反爬拦截，说明基于邮件正文。（链接失效/无法访问：微博反爬拦截）","_fileDate":"2026-08-13","category":["life"]},{"date":"2026-08-09","title":"微博 @Barret李靖：组织朝 AI 转型，首先要解决人的意识问题","src":"wangziqi9924@gmail.com","link":"https://weibo.com/1812166904/5329590125859467","desc":"微博 @Barret李靖 的观点：组织向 AI 转型首先解决人的意识问题。AI 开始补齐人的短板，使越来越多的人具备端到端交付能力（不止全栈技术，还包括需求洞察、产品运营和市场推广）；如果人的意识仍停留在「你有你的地盘、我有我的地盘」的专业分工，AI 用上了组织却还是原来的组织。意识转变后，每个人会往前后延伸考虑上下游衔接、让 AI 补齐依赖别人的工作、把自己的经验转化为 AI 可理解可执行可复用的工作流。微博页面被反爬拦截，说明基于邮件正文。（链接失效/无法访问：微博反爬拦截）","_fileDate":"2026-08-13","category":["tips"]},{"date":"2026-08-09","title":"微博 @Barret李靖：测试和前端等细分工种正被 AI 收敛","src":"wangziqi9924@gmail.com","link":"https://weibo.com/1812166904/5329592828038397","desc":"微博 @Barret李靖 观察：测试和前端开发等细分工种正在逐渐被收敛。今天研发流程仍是 Human in the Loop，更理想的状态是 Human over the Loop——人逐渐脱离具体工作流，让任务自循环、自验证、自进化，核心要解决「验证」问题：AI 生产速度一定超过人的验收速度，验证本身也必须交给 AI；当大量任务的生产验收都发生在 Agent 之间，面向人的前端表达需求会减少，前端工作将从「怎么让人更好地操作系统」转向「怎么让人更好地控制 Agent」。微博页面被反爬拦截，说明基于邮件正文。（链接失效/无法访问：微博反爬拦截）","_fileDate":"2026-08-13","category":["misc"]},{"date":"2026-08-08","title":"设计网站合集：30+ 设计工具/网站导航（3 图）","src":"wangziqi9924@gmail.com","link":"","desc":"**企业级 Design System**：Twilio Paste、Workday Canvas、Adobe Spectrum、GitLab Pajamas、U.S. Web Design System、GOV.UK Design System、SAP Fiori、VMware Clarity、Oracle Redwood","_fileDate":"2026-08-13","category":["tools","create"]},{"date":"2026-08-08","title":"如何0经验进入自己想了解的行业（小红书）","src":"wangziqi9924@gmail.com","link":"https://xhslink.cn/o/7CxI1KQhWyE","desc":"小红书博主「Wild能行の学习笔记」分享的 0 经验转行/入行方法论。作者自称\"三无人员\"（无漂亮履历、无实习经历、无人脉），却拿到了多个行业的\"水下工作机会\"（未公开招募的机会）。破局方式：找到自己的优势点，用技能靠近目标行业——作为志愿者参加行业活动结识从业者，主动向有相关经历的老师 08-07","title":"微博 @AIGC·非著名程序员：AI 时代普通人最大的杠杆","src":"wangziqi9924@gmail.com","link":"https://weibo.com/5078115336/5329313924645832","desc":"微博 @AIGC·非著名程序员 反驳\"普通人最大的杠杆是购买最贵最先进的 AI\"：一个人 80% 的工作并不需要顶级模型，花钱买工具人人都会、谈不上杠杆；真正稀缺的是看到场景、判断\"这个环节可以用 AI 替掉\"并落地交付的能力。普通人该练的三件事：识别需求的眼光（找到重复机械、靠堆人力的场景）、把 AI 嵌入真实流程（把输出接到业务里变成可反复运行的东西）、快速验证和迭代（最小成本试错）。杠杆不在工具本身，在于你拿它撬动了什么。（链接失效/无法访问：微博反爬拦截，说明基于邮件正文）","_fileDate":"2026-08-13","category":["insight"]},{"date":"2026-08-06","title":"微博 @李楠或kkk：用 kimiwork 分析项目再薅腾讯 workbuddy 羊毛","src":"wangziqi9924@gmail.com","link":"https://weibo.com/1645215240/5328561659446070","desc":"微博 @李楠或kkk 分享的薅羊毛玩法：把项目交给 kimiwork 不是让它完成，而是让它分析项目、搜索最新实践、改进整个 workflow 和方法论，再走几轮对抗和 QA；觉得靠谱后让 kimiwork 分离具体项目和方法，把文件夹复制进腾讯 workbuddy 新建项目，即可用 Hy3、GLM5.2 和 DSV4F 接手 kimiwork 的工作框架。（链接失效/无法访问：微博反爬拦截，说明基于邮件正文）","_fileDate":"2026-08-13","category":["tips","deals"]},{"date":"2026-08-06","title":"微博 @歸藏的AI工具箱：Meta 发布 Muse Spark 1.2 与 Muse Code 编程 Agent","src":"wangziqi9924@gmail.com","link":"https://weibo.com/6182606334/5328875103980315","desc":"微博 @歸藏的AI工具箱 介绍：Meta 发布 Muse Spark 1.2 模型和 Muse Code 编程 Agent，价格便宜得像白送，前提是同意其数据收集要求（允许用你的数据训练模型可享约 12 倍折扣，价格与 DeepSeek-Flash 差不多）；但访问 Meta 的模型比用 Anthropic 的还麻烦，网站直接不让访问。在 DeepSeek 即将涨价之际，AI 圈价格战开始了。（链接失效/无法访问：微博反爬拦截，说明基于邮件正文）","_fileDate":"2026-08-13","category":["insight"]},{"date":"2026-08-06","title":"OpenMinis：手机上带沙箱的端侧 AI Agent（微博 @Simon的白日梦）","src":"wangziqi9924@gmail.com","link":"https://weibo.com/1561900137/5330071850062876（08-11 合并 @摇摆时间线ZHLMI 使用体验微博）","desc":"补充（08-11 合并 @摇摆时间线ZHLMI 的使用体验微博）：作者用 Minis 频率已不亚于电脑端 Agent——轻量 Skill、故事创作、日常问答、脑暴都在 Minis 上完成，需要多端配合或复杂环境的才上电脑（OpenClaw + OpenCode 为主）；iOS 端 Node 生态需按「纯 JS > 有 musl prebuilt 且 iSH 不 crash > 其他」的优先级挑选依赖，编译链（better-sqlite3/canvas）和 iSH 不友好的 native（sharp）直接放弃，系统工具用 apk add 装；需浏览器扩展的 OpenCLI 之类无能为力，网页抓取建议走 MCP（豆包搜索、Firecrawl）；Android 端底层更开放、可玩性更高。（微博反爬拦截，说明基于邮件正文）","_fileDate":"2026-08-13","category":["tools","skill"]},{"date":"2026-08-06","title":"Swiftlet：Mac 上仅 4.3GB 内存跑 Qwen 80B","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/2H4g0sTodWU","desc":"小红书笔记（作者 北三陆的猫）：Hacker News 爆火的开源项目 Swiftlet，基于 Swift + Metal 的底层运行时，专为 Qwen3-Next 和 Qwen3.5/3.6 的 MoE 架构设计。核心机制是只把较小的 Dense 层常驻内存，巨大的 MoE 专家权重按路由需求从 SSD 流式加载：实测 Mac 仅用 4.3GB 内存跑 80B 模型，iPhone 17 上用 2.5GB 可用内存跑 35B 模型约 1 tok/s。该方案有争议——依赖 SSD 疯狂读取会遇 Prefill 性能瓶颈，且高频随机读取损伤硬盘寿命；另一派认为这是端侧 AI 走向普及的必经之路。","_fileDate":"2026-08-13","category":["tools"]},{"date":"2026-08-06","title":"OpenPhone：港大开源、让 AI 像人一样操作手机","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/AeexrLkWeTM","desc":"小红书笔记（作者 晓来在进化）：港大开源 OpenPhone，面向手机 AI 助手（Mobile Agent）的项目。核心是仅 30 亿参数的视觉语言模型 OpenPhone-3B，专门针对手机操作优化，能识别界面、理解任务、规划操作并在失败后自动修正；配有两套记忆系统（用户使用习惯 + 操作经验），采用端云协同思路（普通任务本地模型完成、复杂任务调云端大模型），并把训练流程、推理代码、评测工具全部开源（GitHub: HKUDS/OpenPhone）。大王补充：智谱去年开源的 9B OpenAutoGLM 和 AutoGLM App 都不好用，不如字节开源的 Midscene（视觉模型驱动的自动化测试框架）。","_fileDate":"2026-08-13","category":["tools"]},{"date":"2026-08-06","title":"OpenAI 开源 Codex Security：Vibe Coding 安全插件（微信文章）","src":"wangziqi9924@gmail.com","link":"https://mp.weixin.qq.com/s/koVsKEyae9grJqrGtsln9g","desc":"微信公众号「数字生命卡兹克」文章：OpenAI 开源 Codex Security（前身是 2025 年 10 月的 Aardvark，GPT-5 驱动的 Agentic Security Researcher），原本封闭在 Codex 生态内，现在外部 Agent 也能调用——Claude Code、Kimi Code、CodeBuddy、Trae、Qoder 等都能装上它扫描产品漏洞；最新已支持 OpenRouter 和 Fireworks，底层漏洞分析模型可换成自己偏好的选择（GitHub: openai/codex-security）。文章起因是作者自己 Vibe Coding 的产品 AIHOT 被持续攻击，意识到安全是 Vibe Coding 被忽略的一环。","_fileDate":"2026-08-13","category":["tools"]},{"date":"2026-08-06","title":"UI Skills：140+ 高质量 UI 设计工程 Skill 库","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/1ldMm8alwQ4","desc":"小红书笔记（作者 LetmeThink）分享的高质量 UI Skill 库，收集 140+ 个设计工程 skills，帮助人类和 Agent 创建更好的界面；对应 GitHub 项目 jakubkrehel/skills（3.2k Star，覆盖动画、UI 打磨、无障碍、产品文案等），使用方式是让 Agent 先运行 npx ui-skills start 选择合适 skill 再动手修改。（图片帖，正文经 OCR 识别：\"UI Skills is a collection of design-engineering skills to help humans and agents create better interfaces\"）","_fileDate":"2026-08-13","category":["skill","tips"]},{"date":"2026-08-06","title":"微博 @AIGC·非著名程序员：视频提示词核心总结模板","src":"wangziqi9924@gmail.com","link":"https://weibo.com/5078115336/5329027074104042","desc":"微博 @AIGC·非著名程序员 总结的视频生成提示词核心方法论：全局规格 + 主体锁定 + 时间轴镜头单元×N + 跨镜连续性 + 全局负向约束；单个镜头单元公式为「时间段 + 景别与机位 + 主体动作 + 摄影机运动 + 声音或对白 + 本镜头结束状态」，其中「本镜头结束状态」最关键，负责把人物位置、朝向、手中物体、动作动势和情绪交接给下一个镜头。文中附可直接复制的完整模板（含全局风格、主体锁定、逐时间段镜头描述、连续性与禁止项清单）。（链接失效/无法访问：微博反爬拦截，说明基于邮件正文）","_fileDate":"2026-08-13","category":["tips"]},{"date":"2026-08-06","title":"微博 @蚁工厂：review 提示词方法论","src":"wangziqi9924@gmail.com","link":"https://weibo.com/2194035935/5329038600312487","desc":"微博博主 @蚁工厂 分享的一条关于 review（AI 代码审查）提示词方法论的微博，邮件正文未展开具体内容，微博页面被反爬拦截无法抓取正文。（链接失效/无法访问：微博反爬拦截，无更多信息）","_fileDate":"2026-08-13","category":["tips"]},{"date":"2026-08-05","title":"MINIMAX-H3 8-12GB 超低显存优化（B站 Work-Fisher）","src":"wangziqi9924@gmail.com","link":"https://b23.tv/zZchz6S","desc":"B站视频（作者 Work-Fisher，播放 2.5 万+）：分享 MINIMAX-H3（MiniMax H3 视频生成模型）在 8-12GB 超低显存下的优化方案，提供云端版（runninghub 工作流合集）和本地版工作流及模型下载，另涉及 H3 一键整合包、首个加速插件（最高加速约 45%）等内容。","_fileDate":"2026-08-13","category":["tips","create"]},{"date":"2026-08-05","title":"VisionPower：为 DeepSeek 量身定制的识图 MCP","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/1ZaVJCqVOQV","desc":"小红书笔记（作者 Run）：DeepSeek V4 Flash 虽能力大幅提升但本质仍是非多模态模型，配置到 Agent 后无法识图看图。VisionPower（GitHub 项目 RunhuaHuang/VisionPower）应运而生，npm 下载量超 3000，可装到任意 Agent 给非多模态大模型\"插上眼睛\"，尤其适配 Claude Code、Codex 等；本次升级支持在 WebUI 直接配置识图模型并内置大量模型预设，点赞关注私信可领 API Key 享受至少半年无限次免费识图（限量 100 人）。","_fileDate":"2026-08-13","category":["tools"]},{"date":"2026-08-05","title":"DeepSeek 内置联网搜索：V4 秒变实时信息 Agent","src":"wangziqi9924@gmail.com","link":"http://xhslink.cn/o/3Rz543nHcVT","desc":"小红书笔记（作者 AI拯救打工人）：DeepSeek V4 Flash 在 Responses API 里内置了 web_search 工具，开发者声明搜索工具即可由服务端完成联网检索、网页获取与结果整理，无需自建搜索抓取流程。适合 AI 新闻追踪、官方文档查询、竞品研究、内容事实核查、企业外部情报等场景；原生搜索偏开箱即用，需要限定站点/时间时可搭配 Tavily、Perplexity 等外部搜索，封装成 fast/external/verify 三档 WebSeek Skill。","_fileDate":"2026-08-13","category"
